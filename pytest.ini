[pytest]

# ============================================================
# ⚙️ НАСТРОЙКИ ЗАПУСКА
# ============================================================
addopts =
    -s
    --clean-alluredir
    --alluredir=allure-results

# ============================================================
# 📂 ПУТИ К ТЕСТАМ
# ============================================================
testpaths = tests

# ============================================================
# 🏷️ РЕГИСТРАЦИЯ КАСТОМНЫХ МАРКЕРОВ
# ============================================================
markers =

    # ------------------------------------------------------------
    # 🚀 ТИПЫ ПРОГОНОВ (Сьюты)
    # ------------------------------------------------------------
    regress: Регрессионные тесты (основной прогон)
    
    # ------------------------------------------------------------
    # 🛰️ СТРАНИЦЫ (Компоненты)
    # ------------------------------------------------------------
    login: Тесты для страницы авторизации (/login.html)
    dashboard: Тесты для страницы дашборда (/dashboard.html)
    index: Тесты для страницы индекса (/index.html)

    # ------------------------------------------------------------
    # 🌌 ТЕСТЫ INDEX (Уровни)
    # ------------------------------------------------------------
    page: Проверка структуры страницы, наличия элементов и локаторов
    navigation: Переходы между страницами и проверка URL
    visuals: CSS-состояния, hover-эффекты и анимации

    # ------------------------------------------------------------
    # 📡 ТЕСТЫ LOGIN (Уровни)
    # ------------------------------------------------------------
    basic: Базовые сценарии и позитивные проверки
    validation: Валидация полей и негативные сценарии
    edge_cases: Граничные значения, безопасность и UI/UX

    # ------------------------------------------------------------
    # 🖥️ ТЕСТЫ DASHBOARD (Уровни)
    # ------------------------------------------------------------
    init: Инициализация, данные и сессия
    uplink: Активация, анимации и состояния UI
    actions: Действия пользователя, навигация и управление сессией