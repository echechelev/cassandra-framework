<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Тёмный космический фон -->
  <rect x="0" y="0" width="64" height="64" rx="6" fill="#0b1021"/>

  <!-- Мягкое свечение вокруг кольца -->
  <ellipse cx="32" cy="32" rx="24" ry="9" fill="#4da6ff" opacity="0.08"/>

  <!-- Вращающееся кольцо-обитаемое: толстая лента -->
  <ellipse cx="32" cy="32" rx="21" ry="7" fill="none" stroke="#1a5fa8" stroke-width="5"/>
  <ellipse cx="32" cy="32" rx="21" ry="7" fill="none" stroke="#4da6ff" stroke-width="1.5"/>

  <!-- Иллюминаторы, сидящие НА кольце -->
  <circle cx="11" cy="32" r="1.8" fill="#ffffff"/>
  <circle cx="53" cy="32" r="1.8" fill="#ffffff"/>
  <circle cx="14" cy="28" r="1.4" fill="#ffffff" opacity="0.85"/>
  <circle cx="50" cy="28" r="1.4" fill="#ffffff" opacity="0.85"/>
  <circle cx="14" cy="36" r="1.4" fill="#ffffff" opacity="0.85"/>
  <circle cx="50" cy="36" r="1.4" fill="#ffffff" opacity="0.85"/>

  <!-- Спицы, соединяющие кольцо с ядром -->
  <line x1="13" y1="32" x2="28" y2="32" stroke="#1a5fa8" stroke-width="1.5"/>
  <line x1="36" y1="32" x2="51" y2="32" stroke="#1a5fa8" stroke-width="1.5"/>

  <!-- Центральное ядро (ось вращения) -->
  <rect x="28" y="12" width="8" height="40" rx="2.5" fill="#ffffff" stroke="#1a5fa8" stroke-width="1.5"/>

  <!-- Палубы на ядре (ощущение масштаба) -->
  <line x1="28" y1="18" x2="36" y2="18" stroke="#1a5fa8" stroke-width="1" opacity="0.6"/>
  <line x1="28" y1="24" x2="36" y2="24" stroke="#1a5fa8" stroke-width="1" opacity="0.6"/>
  <line x1="28" y1="40" x2="36" y2="40" stroke="#1a5fa8" stroke-width="1" opacity="0.6"/>
  <line x1="28" y1="46" x2="36" y2="46" stroke="#1a5fa8" stroke-width="1" opacity="0.6"/>

  <!-- Стыковочный узел сверху -->
  <line x1="32" y1="12" x2="32" y2="7" stroke="#1a5fa8" stroke-width="1.5"/>
  <circle cx="32" cy="5.5" r="2" fill="#4da6ff" stroke="#ffffff" stroke-width="1"/>

  <!-- Массивный двигатель GENESIS CORE -->
  <path d="M 26 52 L 23 58 L 41 58 L 38 52 Z" fill="#1a5fa8" stroke="#ffffff" stroke-width="1.2"/>
  <path d="M 27 58 L 32 63 L 37 58 Z" fill="#4da6ff"/>
  <path d="M 29.5 58 L 32 61.5 L 34.5 58 Z" fill="#ffffff"/>
</svg>