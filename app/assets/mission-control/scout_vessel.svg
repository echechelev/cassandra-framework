<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Тёмный космический фон -->
  <rect x="0" y="0" width="64" height="64" rx="6" fill="#0b1021"/>
  
  <!-- Левая солнечная панель (белая) - уменьшена и сдвинута к центру -->
  <rect x="8" y="14" width="12" height="8" rx="2" transform="rotate(-45 14 18)" fill="#ffffff" stroke="#1a5fa8" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="14" y1="14" x2="14" y2="22" transform="rotate(-45 14 18)" stroke="#1a5fa8" stroke-width="1.5"/>
  
  <!-- Правая солнечная панель (синяя) - уменьшена и сдвинута к центру -->
  <rect x="44" y="40" width="12" height="8" rx="2" transform="rotate(-45 50 44)" fill="#4da6ff" stroke="#1a5fa8" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="50" y1="40" x2="50" y2="48" transform="rotate(-45 50 44)" stroke="#1a5fa8" stroke-width="1.5"/>

  <!-- Левая антенна (белая) - сдвинута к центру -->
  <path d="M 20 44 A 5 5 0 0 1 26 38" fill="#ffffff" stroke="#1a5fa8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="20" cy="44" r="1.5" fill="#1a5fa8"/>

  <!-- Правая антенна (синяя) - сдвинута к центру -->
  <path d="M 38 26 A 5 5 0 0 1 44 32" fill="#4da6ff" stroke="#1a5fa8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="44" cy="32" r="1.5" fill="#1a5fa8"/>

  <!-- Центральное тело: левая половина белая -->
  <path d="M 32 24 A 9 9 0 0 0 32 42 Z" fill="#ffffff" stroke="#1a5fa8" stroke-width="2.5"/>
  <!-- Центральное тело: правая половина синяя -->
  <path d="M 32 24 A 9 9 0 0 1 32 42 Z" fill="#4da6ff" stroke="#1a5fa8" stroke-width="2.5"/>
</svg>