<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Тёмный космический фон -->
  <rect x="0" y="0" width="64" height="64" rx="6" fill="#0b1021"/>
  
  <!-- Центральное ядро (ось вращения) -->
  <rect x="28" y="10" width="8" height="44" rx="2" fill="#ffffff" stroke="#1a5fa8" stroke-width="2"/>
  
  <!-- Стыковочный узел сверху -->
  <line x1="32" y1="10" x2="32" y2="6" stroke="#1a5fa8" stroke-width="2"/>
  <circle cx="32" cy="5" r="1.5" fill="#4da6ff"/>
  
  <!-- Вращающееся кольцо (эллипс) -->
  <ellipse cx="32" cy="32" rx="24" ry="8" fill="none" stroke="#1a5fa8" stroke-width="2.5"/>
  <ellipse cx="32" cy="32" rx="24" ry="8" fill="#4da6ff" opacity="0.3"/>
  
  <!-- Иллюминаторы на кольце (жилой отсек) -->
  <circle cx="12" cy="32" r="2" fill="#ffffff" stroke="#1a5fa8" stroke-width="1.5"/>
  <circle cx="20" cy="28" r="2" fill="#ffffff" stroke="#1a5fa8" stroke-width="1.5"/>
  <circle cx="44" cy="28" r="2" fill="#ffffff" stroke="#1a5fa8" stroke-width="1.5"/>
  <circle cx="52" cy="32" r="2" fill="#ffffff" stroke="#1a5fa8" stroke-width="1.5"/>
  
  <!-- Спицы, соединяющие кольцо с ядром -->
  <line x1="32" y1="24" x2="32" y2="40" stroke="#1a5fa8" stroke-width="1.5"/>
  <line x1="20" y1="32" x2="44" y2="32" stroke="#1a5fa8" stroke-width="1.5"/>
  
  <!-- Массивные маршевые двигатели снизу -->
  <path d="M 26 54 L 24 60 L 40 60 L 38 54 Z" fill="#4da6ff" stroke="#1a5fa8" stroke-width="2"/>
  <path d="M 28 56 L 32 62 L 36 56 Z" fill="#ffffff"/> <!-- свечение -->
</svg>