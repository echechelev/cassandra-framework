  <!-- Секции корпуса -->
  <line x1="29" y1="26" x2="35" y2="26" stroke="#1a5fa8" stroke-width="1" opacity="0.7"/>
  <line x1="29" y1="32" x2="35" y2="32" stroke="#1a5fa8" stroke-width="1" opacity="0.7"/>
  <line x1="29" y1="38" x2="35" y2="38" stroke="#1a5fa8" stroke-width="1" opacity="0.7"/>

  <!-- Крылья -->
  <path d="M 29 34 L 20 42 L 29 42 Z" fill="#1a5fa8" opacity="0.8"/>
  <path d="M 29 34 L 20 42 L 29 42 Z" fill="none" stroke="#ffffff" stroke-width="1"/>

  <path d="M 35 34 L 44 42 L 35 42 Z" fill="#1a5fa8" opacity="0.8"/>
