<svg xmlns="http://www.w3.org/2000/svg" viewBox="9 6 46 46">

  <!-- Основной корпус -->
  <path d="M 32 14 L 29 20 L 29 42 L 35 42 L 35 20 Z" fill="#e8e8e8" opacity="0.9"/>
  <path d="M 32 14 L 29 20 L 29 42 L 35 42 L 35 20 Z" fill="none" stroke="#1a5fa8" stroke-width="1.5"/>

  <!-- Носовой конус -->
