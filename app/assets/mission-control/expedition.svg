<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Темный фон -->
  <rect x="0" y="0" width="64" height="64" rx="6" fill="#0b1021"/>
  
  <!-- Группа исследователей (3 фигуры) -->
  <!-- Центральная фигура -->
  <circle cx="32" cy="24" r="5" fill="#ffffff" stroke="#1a5fa8" stroke-width="2"/>
  <path d="M 24 38 Q 32 34 40 38" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Левая фигура (чуть сзади) -->
  <circle cx="21" cy="28" r="4" fill="#ffffff" stroke="#1a5fa8" stroke-width="1.5"/>
  <path d="M 14 40 Q 21 37 28 40" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Правая фигура (чуть сзади) -->
  <circle cx="43" cy="28" r="4" fill="#ffffff" stroke="#1a5fa8" stroke-width="1.5"/>
  <path d="M 36 40 Q 43 37 50 40" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Голографическая цель (планета/объект исследования) перед ними -->
  <circle cx="32" cy="48" r="6" fill="#4da6ff" stroke="#1a5fa8" stroke-width="1.5"/>
  
  <!-- Луч сканирования от группы к цели -->
  <path d="M 32 38 L 32 42" stroke="#4da6ff" stroke-width="1.5" stroke-dasharray="2 2"/>
  
  <!-- Импульс исследования вокруг цели -->
  <path d="M 24 48 A 8 8 0 0 1 40 48" fill="none" stroke="#4da6ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
</svg>