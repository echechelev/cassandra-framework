<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Темный фон -->
  <rect x="0" y="0" width="64" height="64" rx="6" fill="#0b1021"/>
  
  <!-- Планета -->
  <circle cx="32" cy="32" r="14" fill="#ffffff" stroke="#1a5fa8" stroke-width="2"/>
  
  <!-- Сетка координат на планете -->
  <path d="M 18 32 Q 32 24 46 32" fill="none" stroke="#1a5fa8" stroke-width="1.5"/>
  <path d="M 32 18 L 32 46" fill="none" stroke="#1a5fa8" stroke-width="1.5"/>
  
  <!-- Тактический прицел (4 уголка) -->
  <path d="M 14 14 L 14 22 M 14 14 L 22 14" fill="none" stroke="#4da6ff" stroke-width="2" stroke-linecap="round"/>
  <path d="M 50 14 L 50 22 M 50 14 L 42 14" fill="none" stroke="#4da6ff" stroke-width="2" stroke-linecap="round"/>
  <path d="M 14 50 L 14 42 M 14 50 L 22 50" fill="none" stroke="#4da6ff" stroke-width="2" stroke-linecap="round"/>
  <path d="M 50 50 L 50 42 M 50 50 L 42 50" fill="none" stroke="#4da6ff" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Сканирующий луч -->
  <line x1="32" y1="32" x2="46" y2="18" stroke="#4da6ff" stroke-width="1.5" stroke-dasharray="2 2"/>
  <circle cx="46" cy="18" r="2" fill="#4da6ff"/>
</svg>