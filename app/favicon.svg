<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Белый фон-подложка (с лёгким скруглением углов) -->
  <rect x="0" y="0" width="64" height="64" rx="6" fill="#ffffff"/>
  
  <!-- Левая солнечная панель (белая) -->
  <rect x="4" y="10" width="16" height="10" rx="2" transform="rotate(-45 12 15)" fill="#ffffff" stroke="#1a5fa8" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="12" y1="10" x2="12" y2="20" transform="rotate(-45 12 15)" stroke="#1a5fa8" stroke-width="1.5"/>
  
  <!-- Правая солнечная панель (синяя) -->
  <rect x="44" y="44" width="16" height="10" rx="2" transform="rotate(-45 52 49)" fill="#4da6ff" stroke="#1a5fa8" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="52" y1="44" x2="52" y2="54" transform="rotate(-45 52 49)" stroke="#1a5fa8" stroke-width="1.5"/>

  <!-- Левая антенна (белая) -->
  <path d="M 18 46 A 6 6 0 0 1 26 38" fill="#ffffff" stroke="#1a5fa8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="18" cy="46" r="1.5" fill="#1a5fa8"/>

  <!-- Правая антенна (синяя) -->
  <path d="M 38 26 A 6 6 0 0 1 46 18" fill="#4da6ff" stroke="#1a5fa8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="46" cy="18" r="1.5" fill="#1a5fa8"/>

  <!-- Центральное тело: левая половина белая -->
  <path d="M 32 21 A 11 11 0 0 0 32 43 Z" fill="#ffffff" stroke="#1a5fa8" stroke-width="2.5"/>
  <!-- Центральное тело: правая половина синяя -->
  <path d="M 32 21 A 11 11 0 0 1 32 43 Z" fill="#4da6ff" stroke="#1a5fa8" stroke-width="2.5"/>
</svg>