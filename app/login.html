<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cassandra — Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Roboto', sans-serif;
    }

    body {
      color: #e8ecff;
      background: #050816;
      overflow-x: hidden;
      position: relative;
      margin: 0;
      padding: 0;
    }

    /* ФОН */
    .stars {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: radial-gradient(1px 1px at 25% 15%, rgba(255, 255, 255, .9), transparent 50%),
        radial-gradient(1px 1px at 65% 35%, rgba(255, 255, 255, .7), transparent 50%),
        linear-gradient(180deg, #050816 0%, #0a0e27 50%, #131b3a 100%);
      background-size: 220px 220px, 260px 260px, 100% 100%;
    }

    .milkyway {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .milkyway .band {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 240vmax;
      height: 420px;
      transform: translate(-50%, -50%) rotate(-28deg);
      background: linear-gradient(180deg, transparent, rgba(120, 160, 255, .05) 18%, rgba(190, 215, 255, .13) 42%, rgba(255, 255, 255, .20) 50%, rgba(190, 215, 255, .13) 58%, rgba(120, 160, 255, .05) 82%, transparent);
      filter: blur(12px);
    }

    /* КАРТОЧКА */
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background: rgba(10, 15, 40, 0.75);
      border: 1px solid rgba(77, 166, 255, 0.3);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 40px rgba(77, 166, 255, 0.15), inset 0 0 15px rgba(77, 166, 255, 0.05);
      text-align: center;
      position: relative;
      z-index: 2;
    }

    /* ЛОГОТИП */
    .login-logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }

    .login-logo .white-part {
      color: #ffffff;
    }

    .login-logo .blue-part {
      color: #4da6ff;
      text-shadow: 0 0 15px rgba(77, 166, 255, 0.6);
    }

    .login-sub {
      font-size: 13px;
      color: #7a86b8;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    /* ПОЛЯ */
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-label {
      display: block;
      font-size: 12px;
      color: #9fb0e8;
      margin-bottom: 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .input-field {
      width: 100%;
      padding: 14px 16px;
      border-radius: 8px;
      border: 1px solid rgba(77, 166, 255, 0.3);
      background: rgba(5, 8, 22, 0.8);
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
    }

    .input-field:focus {
      border-color: #4da6ff;
      box-shadow: 0 0 15px rgba(77, 166, 255, 0.2);
    }

    .input-field::placeholder {
      color: #4a5480;
    }

    .input-field.error {
      border-color: #e74c3c;
      box-shadow: 0 0 15px rgba(231, 76, 60, 0.2);
    }

    /* КОНТЕЙНЕР ДЛЯ ПОЛЯ ПАРОЛЯ С ИКОНКОЙ */
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-wrapper .input-field {
      padding-right: 45px;
    }

    /* КНОПКА ПЕРЕКЛЮЧЕНИЯ ВИДИМОСТИ ПАРОЛЯ */
    .password-toggle {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #7a86b8;
      transition: color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .password-toggle:hover {
      color: #4da6ff;
    }

    .password-toggle:focus {
      outline: none;
    }

    .eye-icon {
      transition: opacity 0.2s ease;
    }

    /* ОШИБКИ */
    .auth-error {
      display: none;
      background: rgba(231, 76, 60, 0.1);
      border: 1px solid rgba(231, 76, 60, 0.4);
      color: #ffadad;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .auth-error.visible {
      display: block;
      animation: fadeInUp 0.3s ease;
    }

    /* КНОПКА ВХОДА */
    .login-btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #1e5fbf, #4da6ff);
      color: white;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(77, 166, 255, 0.3);
      transition: transform 0.1s ease, box-shadow 0.3s ease;
    }

    /* Физический прожим кнопки (когда палец/мышь давит) */
    .login-btn:active:not(:disabled) {
      transform: translateY(2px) scale(0.98);
      box-shadow: 0 0 10px rgba(77, 166, 255, 0.3);
    }

    .login-btn:hover:not(:disabled) {
      box-shadow: 0 0 30px rgba(77, 166, 255, 0.6);
    }

    /* Стандартное серое состояние (когда поля не заполнены) */
    .login-btn:disabled:not(.processing) {
      opacity: 0.5;
      cursor: not-allowed;
      filter: grayscale(0.8);
      box-shadow: none;
    }

    /* === ВАЙБУЮЩИЙ ПУЛЬСАР (Состояние обработки) === */
    .login-btn.processing {
      background: #1e5fbf;
      opacity: 0.9;
      cursor: wait;
      animation: pulse-btn 1.5s infinite ease-in-out;
    }

    /* Переопределяем серый disabled для пульсара */
    .login-btn.processing:disabled {
      opacity: 0.9;
      filter: none;
      transform: none;
    }

    @keyframes pulse-btn {
      0% {
        box-shadow: 0 0 15px rgba(77, 166, 255, 0.3);
      }

      50% {
        box-shadow: 0 0 40px rgba(77, 166, 255, 0.9);
      }

      100% {
        box-shadow: 0 0 15px rgba(77, 166, 255, 0.3);
      }
    }

    /* БЛОК ВОССТАНОВЛЕНИЯ */
    .recovery-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 25px;
      align-items: center;
    }

    .recovery-text {
      font-size: 12px;
      color: #5a6488;
      letter-spacing: 0.5px;
      cursor: default;
    }

    .recovery-link {
      font-size: 12px;
      text-decoration: none;
      transition: 0.2s;
      letter-spacing: 0.5px;
      padding: 6px 16px;
      border-radius: 12px;
      color: #4da6ff;
      border: 1px solid rgba(77, 166, 255, 0.3);
      background: rgba(77, 166, 255, 0.05);
    }

    .recovery-link:hover {
      background: rgba(77, 166, 255, 0.15);
      border-color: #4da6ff;
      box-shadow: 0 0 15px rgba(77, 166, 255, 0.2);
    }

    /* ФУТЕР */
    .login-footer {
      margin-top: 30px;
      text-align: center;
      color: #4a5480;
      font-size: 12px;
      letter-spacing: 1px;
      padding-bottom: 20px;
    }

    .copyright {
      margin-top: 40px;
      font-size: 14px;
      letter-spacing: 1.5px;
      color: #5a6488;
    }

    .telemetry {
      color: #4da6ff;
      font-family: 'Courier New', monospace;
      margin-bottom: 8px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(77, 166, 255, 0.4);
    }

    .telemetry::after {
      content: "█";
      animation: blink 1s step-end infinite;
      margin-left: 4px;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    /* СПУТНИК */
    #satellite {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
      pointer-events: none;
      filter: drop-shadow(0 0 8px rgba(77, 166, 255, 0.4));
    }

    .radio-wave {
      fill: none;
      stroke: #4da6ff;
      stroke-width: 2;
      opacity: 0;
      transform-origin: 50px 30px;
      animation: pulse-wave 2s infinite ease-out;
      pointer-events: none;
    }

    .radio-wave:nth-of-type(1) {
      animation-delay: 0s;
    }

    .radio-wave:nth-of-type(2) {
      animation-delay: 0.6s;
    }

    .radio-wave:nth-of-type(3) {
      animation-delay: 1.2s;
    }

    @keyframes pulse-wave {
      0% {
        transform: scale(0.5);
        opacity: 0.8;
        stroke-width: 3;
      }

      100% {
        transform: scale(3.5);
        opacity: 0;
        stroke-width: 0.5;
      }
    }

    /* ОБЁРТКА ДЛЯ ЦЕНТРИРОВАНИЯ КАРТОЧКИ И ФУТЕРА */
    .login-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100%;
      padding: 20px 0;
      box-sizing: border-box;
    }
  </style>
</head>

<body>

  <div class="stars"></div>
  <div class="milkyway">
    <div class="band"></div>
  </div>

  <!-- ЛЕТАЮЩИЙ СПУТНИК С РАДИОВОЛНАМИ -->
  <div id="satellite">
    <svg width="60" height="40" viewBox="0 0 100 60">
      <circle cx="50" cy="30" r="15" class="radio-wave" />
      <circle cx="50" cy="30" r="15" class="radio-wave" />
      <circle cx="50" cy="30" r="15" class="radio-wave" />
      <rect x="5" y="15" width="30" height="30" rx="2" fill="#1e5fbf" stroke="#4da6ff" stroke-width="2" />
      <rect x="65" y="15" width="30" height="30" rx="2" fill="#1e5fbf" stroke="#4da6ff" stroke-width="2" />
      <line x1="15" y1="15" x2="15" y2="45" stroke="#4da6ff" stroke-width="1" opacity="0.5" />
      <line x1="25" y1="15" x2="25" y2="45" stroke="#4da6ff" stroke-width="1" opacity="0.5" />
      <line x1="75" y1="15" x2="75" y2="45" stroke="#4da6ff" stroke-width="1" opacity="0.5" />
      <line x1="85" y1="15" x2="85" y2="45" stroke="#4da6ff" stroke-width="1" opacity="0.5" />
      <rect x="35" y="20" width="30" height="20" rx="4" fill="#e8ecff" stroke="#4da6ff" stroke-width="2" />
      <line x1="50" y1="20" x2="50" y2="5" stroke="#9fb0e8" stroke-width="2" />
      <circle cx="50" cy="5" r="3" fill="#4da6ff" />
      <circle cx="42" cy="30" r="2" fill="#2ecc71">
        <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite" />
      </circle>
    </svg>
  </div>

  <div class="login-wrapper">

    <div class="login-card">
      <div class="login-logo">
        <span class="white-part">CASSAN</span><span class="blue-part">DRA</span>
      </div>

      <div class="login-sub">Access to Colonization Assessment System</div>

      <div class="auth-error" id="auth-error" data-wm-id="auth-error-message">
        ⚠️ Invalid callsign or access code
      </div>

      <form onsubmit="handleLogin(event)" novalidate>
        <div class="input-group">
          <label class="input-label" for="callsign">Callsign</label>
          <input type="text" id="callsign" class="input-field" placeholder="Enter callsign" maxlength="100"
            minlength="3" data-wm-id="login-callsign-input" autocomplete="off">
        </div>

        <div class="input-group">
          <label class="input-label" for="access-code">Access Code</label>
          <div class="password-wrapper">
            <input type="password" id="access-code" class="input-field" placeholder="Enter access code" maxlength="30"
              minlength="4" inputmode="text" data-wm-id="login-access-code-input" autocomplete="off">
            <button type="button" class="password-toggle" id="toggle-password" data-wm-id="toggle-password-btn"
              aria-label="Toggle password visibility">
              <svg class="eye-icon eye-open" viewBox="0 0 24 24" width="20" height="20">
                <path
                  d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
                  fill="currentColor" />
              </svg>
              <svg class="eye-icon eye-closed" viewBox="0 0 24 24" width="20" height="20" style="display:none;">
                <path
                  d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"
                  fill="currentColor" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn" id="submit-btn" data-wm-id="establish-connect-btn" disabled>
          Establish Connection
        </button>
      </form>

      <div class="recovery-actions">
        <div class="recovery-text" data-wm-id="lost-access-text">Lost access code?</div>
        <a href="forgot-password.html" class="recovery-link" data-wm-id="restore-clearance-link">Restore clearance</a>
      </div>
    </div>

    <footer class="login-footer">
      <div class="telemetry" data-wm-id="system-telemetry">> SYSTEM READY. AWAITING CONNECTION</div>
      <div class="copyright">Evknopia © 2026</div>
    </footer>

  </div>

  <!-- Подключаем базу данных пользователей -->
  <script src="data.js"></script>

  <script>
    // === ЛОГИКА ЛЕТАЮЩЕГО СПУТНИКА ===
    const satellite = document.getElementById('satellite');
    let x = Math.random() * (window.innerWidth - 60);
    let y = Math.random() * (window.innerHeight - 40);
    let dx = 1.2;
    let dy = 0.9;

    function animateSatellite() {
      const rect = satellite.getBoundingClientRect();
      const width = window.innerWidth;
      const height = window.innerHeight;

      if (x + rect.width > width || x < 0) dx = -dx;
      if (y + rect.height > height || y < 0) dy = -dy;

      x += dx;
      y += dy;

      satellite.style.transform = `translate(${x}px, ${y}px)`;
      requestAnimationFrame(animateSatellite);
    }
    requestAnimationFrame(animateSatellite);

    // === ЛОГИКА АВТОРИЗАЦИИ ===
    const callsignInput = document.getElementById('callsign');
    const accessCodeInput = document.getElementById('access-code');
    const submitBtn = document.getElementById('submit-btn');
    const authErrorBlock = document.getElementById('auth-error');
    const telemetryText = document.querySelector('.telemetry');

    // Валидация Access Code: только латиница, цифры и _
    accessCodeInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^a-zA-Z0-9_]/g, '');
      checkFormState();
    });

    callsignInput.addEventListener('input', checkFormState);

    // === ПЕРЕКЛЮЧЕНИЕ ВИДИМОСТИ ПАРОЛЯ ===
    const togglePasswordBtn = document.getElementById('toggle-password');
    const eyeOpen = document.querySelector('.eye-open');
    const eyeClosed = document.querySelector('.eye-closed');

    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = accessCodeInput.type === 'password';
      if (isPassword) {
        accessCodeInput.type = 'text';
        eyeOpen.style.display = 'none';
        eyeClosed.style.display = 'block';
      } else {
        accessCodeInput.type = 'password';
        eyeOpen.style.display = 'block';
        eyeClosed.style.display = 'none';
      }
    });

    // Кнопка активна только при достижении минимальной длины
    function checkFormState() {
      clearErrors();
      const isCallsignValid = callsignInput.value.length >= 3;
      const isAccessCodeValid = accessCodeInput.value.length >= 4;
      submitBtn.disabled = !(isCallsignValid && isAccessCodeValid);
    }

    function handleLogin(event) {
      event.preventDefault();
      clearErrors();

      const callsign = callsignInput.value.trim().toUpperCase();
      const accessCode = accessCodeInput.value.trim();

      // Защита от отправки невалидных данных (хотя кнопка и так disabled)
      if (callsign.length < 3 || accessCode.length < 4) {
        return;
      }

      // 🚀 БЛОКИРУЕМ КНОПКУ И ВКЛЮЧАЕМ ПУЛЬСАР
      submitBtn.classList.add('processing');
      submitBtn.disabled = true;
      submitBtn.textContent = 'CONNECTING...';

      // 🌌 ИМИТАЦИЯ ЗАДЕРЖКИ СЕТИ (3 секунды "полета сигнала")
      setTimeout(() => {

        // ПРОВЕРКА БАЗЕ MOCK_USERS
        const user = MOCK_USERS[callsign];
        const isAuthenticated = user && user.accessCode === accessCode;

        if (isAuthenticated) {
          // ✅ УСПЕХ
          localStorage.setItem('currentUser', JSON.stringify(user));

          authErrorBlock.style.display = 'none';
          telemetryText.style.color = '#2ecc71';
          telemetryText.innerHTML = `> CONNECTION ESTABLISHED. WELCOME, ${user.role.toUpperCase()} ${user.fullName.toUpperCase()}`;

          setTimeout(() => {
            window.location.href = 'landing.html';
          }, 3000);

        } else {
          // ❌ ОШИБКА
          authErrorBlock.classList.add('visible');
          telemetryText.style.color = '#e74c3c';
          telemetryText.innerHTML = '> SYSTEM FAILURE. INVALID CREDENTIALS';

          // Сбрасываем кнопку
          submitBtn.classList.remove('processing');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Establish Connection';
        }

      }, 3000);
    }

    function clearErrors() {
      // 1. Скрываем блок ошибки сверху
      authErrorBlock.classList.remove('visible');

      // 2. Убираем красную обводку с полей ввода
      document.querySelectorAll('.input-field').forEach(el => el.classList.remove('error'));

      // 3. 🌌 СБРАСЫВАЕМ ТЕЛЕМЕТРИЮ В ИСХОДНОЕ СОСТОЯНИЕ (Нейтральный синий)
      telemetryText.style.color = '#4da6ff';
      telemetryText.innerHTML = '> SYSTEM READY. AWAITING CONNECTION';

      // 4. Сбрасываем состояние кнопки
      submitBtn.classList.remove('processing');
      submitBtn.textContent = 'Establish Connection';
    }

    callsignInput.addEventListener('focus', clearErrors);
    accessCodeInput.addEventListener('focus', clearErrors);

    // Ждем полной загрузки DOM
    document.addEventListener('DOMContentLoaded', () => {
      const callsignInputEl = document.querySelector('[data-wm-id="login-callsign-input"]');
      if (callsignInputEl) {
        callsignInputEl.addEventListener('input', function () {
          // Блокируем только кириллицу, разрешая латиницу, цифры и спецсимволы
          this.value = this.value.replace(/[а-яА-ЯёЁ]/g, '');
        });
      }
    });
  </script>

</body>
</html>
