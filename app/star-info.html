<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cassandra — Star Info</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', sans-serif;
        }

        body {
            color: #e8ecff;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            background-color: #050816;
        }

        .stars {
            position: fixed;
            inset: 0;
            z-index: -3;
            background: radial-gradient(1px 1px at 10% 10%, rgba(255, 255, 255, .9), transparent 50%),
                radial-gradient(1.5px 1.5px at 20% 30%, rgba(255, 255, 255, .7), transparent 50%),
                radial-gradient(1px 1px at 30% 70%, rgba(255, 255, 255, .8), transparent 50%),
                radial-gradient(2px 2px at 40% 20%, rgba(255, 255, 255, .6), transparent 50%),
                radial-gradient(1px 1px at 50% 50%, rgba(255, 255, 255, .9), transparent 50%),
                linear-gradient(180deg, #050816 0%, #0a0e27 50%, #131b3a 100%);
            background-size: 15vmin 15vmin, 20vmin 20vmin, 18vmin 18vmin, 25vmin 25vmin, 16vmin 16vmin, 100% 100%;
        }

        .milkyway {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
        }

        .milkyway .band {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 280vmax;
            height: 25vmin;
            transform: translate(-50%, -50%) rotate(-28deg);
            background: linear-gradient(180deg, transparent, rgba(120, 160, 255, .08) 15%, rgba(190, 215, 255, .18) 35%, rgba(255, 255, 255, .25) 50%, rgba(190, 215, 255, .18) 65%, rgba(120, 160, 255, .08) 85%, transparent);
            filter: blur(1.5vmin);
        }

        .page-header {
            position: fixed;
            top: 4vmin;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
        }

        .page-title {
            font-size: 4.5vmin;
            font-weight: 800;
            letter-spacing: 0.6vmin;
            text-transform: uppercase;
        }

        .page-title .white-part { color: #ffffff; }
        .page-title .blue-part { color: #4da6ff; text-shadow: 0 0 2vmin rgba(77, 166, 255, 0.8); }

        /* Контейнер для объекта в центре */
        .center-object-wrapper {
            position: fixed;
            top: 45%; /* Чуть выше, чтобы освободить место для текста внизу */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50vmin;
            height: 50vmin;
            z-index: 25;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .center-object-container {
            position: relative;
            width: 35vmin;
            height: 35vmin;
        }

        .center-object {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        /* Стили для Черной Дыры */
        .event-horizon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 45%;
            height: 45%;
            background: #000000;
            border-radius: 50%;
            box-shadow: 0 0 0 0.3vmin #000000, 0 0 1.5vmin rgba(0, 0, 0, 1);
        }

        .photon-ring-main {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 70%;
            border-radius: 50%;
            background: transparent;
            box-shadow: 0 0 2vmin rgba(255, 120, 50, 0.6), 0 0 4vmin rgba(255, 100, 40, 0.4);
            filter: blur(1vmin);
        }

        .accretion-disk {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 35%;
            background: radial-gradient(ellipse at center, rgba(255, 200, 100, 0.4) 0%, rgba(255, 150, 70, 0.6) 30%, rgba(255, 100, 50, 0.5) 50%, rgba(255, 150, 70, 0.6) 70%, rgba(255, 200, 100, 0.4) 100%);
            border-radius: 50%;
            filter: blur(0.8vmin);
        }

        /* Стили для Звезды */
        .star-sphere {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 45%;
            height: 45%;
            border-radius: 50%;
        }

        .star-sphere.sun { background: radial-gradient(circle at 30% 30%, #fff5b0, #ffcc00, #ff8800); box-shadow: 0 0 4vmin rgba(255, 200, 0, 0.8), 0 0 8vmin rgba(255, 150, 0, 0.4); }
        .star-sphere.alpha { background: radial-gradient(circle at 30% 30%, #ffffff, #ffe066, #ffaa00); box-shadow: 0 0 4vmin rgba(255, 255, 220, 0.9), 0 0 8vmin rgba(255, 200, 100, 0.5); }
        .star-sphere.epsilon { background: radial-gradient(circle at 30% 30%, #ffcc66, #ff8800, #cc5500); box-shadow: 0 0 4vmin rgba(255, 136, 0, 0.7); }
        .star-sphere.tau { background: radial-gradient(circle at 30% 30%, #fff0b3, #ffdb4d, #e6b800); box-shadow: 0 0 4vmin rgba(255, 219, 77, 0.7); }
        .star-sphere.teegarden { background: radial-gradient(circle at 30% 30%, #ff6666, #cc0000, #660000); box-shadow: 0 0 4vmin rgba(204, 0, 0, 0.8), 0 0 8vmin rgba(150, 0, 0, 0.4); }
        .star-sphere.trappist { background: radial-gradient(circle at 30% 30%, #ff4444, #aa0000, #550000); box-shadow: 0 0 4vmin rgba(200, 0, 0, 0.8), 0 0 8vmin rgba(100, 0, 0, 0.5); }

        /* Заглушка "В разработке" */
        .construction-status {
            position: fixed;
            bottom: 18vh;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
        }

        .construction-code {
            font-size: 8vmin;
            font-weight: 900;
            color: #4da6ff;
            text-shadow: 0 0 3vmin rgba(77, 166, 255, 0.8);
            margin-bottom: 1vmin;
            animation: pulse 2s ease-in-out infinite;
        }

        .construction-message {
            font-size: 2vmin;
            font-weight: 600;
            color: #e8ecff;
            text-transform: uppercase;
            letter-spacing: 0.2vmin;
            margin-bottom: 0.5vmin;
        }

        .construction-subtext {
            font-size: 1.2vmin;
            color: #4a5480;
            text-transform: uppercase;
            letter-spacing: 0.1vmin;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* Кнопка назад */
        .back-btn {
            position: fixed;
            bottom: 4vh;
            left: 2vw;
            width: 10vmin;
            height: 10vmin;
            border-radius: 50%;
            border: 0.2vmin solid rgba(77, 166, 255, 0.8);
            background: rgba(10, 15, 40, 0.7);
            backdrop-filter: blur(1vmin);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.35vmin;
            z-index: 20;
            box-shadow: 0 0 1.5vmin rgba(77, 166, 255, 0.5), inset 0 0 1vmin rgba(77, 166, 255, 0.3);
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .back-btn:hover {
            border-color: #4da6ff;
            box-shadow: 0 0 3vmin rgba(77, 166, 255, 0.8);
            transform: scale(1.1);
        }

        .back-icon { font-size: 3vmin; filter: drop-shadow(0 0 0.8vmin rgba(77, 166, 255, 0.5)); }
        .back-label { font-size: 1.1vmin; font-weight: 600; color: #e8ecff; text-transform: uppercase; text-align: center; }

        .page-footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            color: #4a5480;
            font-size: 1.2vmin;
            padding-bottom: 2vmin;
            z-index: 10;
        }
    </style>
</head>

<body>
    <div class="stars"></div>
    <div class="milkyway">
        <div class="band"></div>
    </div>

    <header class="page-header">
        <h1 class="page-title" id="page-title">
            <span class="white-part">STAR</span> <span class="blue-part">INFO</span>
        </h1>
    </header>

    <div class="center-object-wrapper">
        <div class="center-object-container">
            <div class="center-object" id="center-object">
                <!-- Сюда JS вставит либо дыру, либо звезду -->
            </div>
        </div>
    </div>

    <!-- Заглушка "В разработке" -->
    <div class="construction-status">
        <div class="construction-code">WIP</div>
        <div class="construction-message">MODULE UNDER CONSTRUCTION</div>
        <div class="construction-subtext">Detailed stellar data is being compiled</div>
    </div>

    <!-- Кнопка возврата на Карту Галактик -->
    <a href="galaxy-map.html" class="back-btn">
        <span class="back-icon">🌌</span>
        <span class="back-label">GALAXY<br>MAP</span>
    </a>

    <footer class="page-footer">
        <div class="copyright">Evknopia © 2026</div>
    </footer>

    <script src="data.js"></script>
    <script>
        (function initAuth() {
            const userDataStr = sessionStorage.getItem('currentUser');
            if (!userDataStr) {
                window.location.href = 'login.html';
                return;
            }
            try { JSON.parse(userDataStr); } catch (e) { window.location.href = 'login.html'; }
        })();

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const starKey = urlParams.get('star');
            const starData = window.starDatabase ? window.starDatabase[starKey] : null;

            const titleEl = document.getElementById('page-title');
            const objectEl = document.getElementById('center-object');

            if (starData) {
                // 1. Меняем заголовок
                const parts = starData.designation.split(' ');
                if (parts.length > 1) {
                    titleEl.innerHTML = `<span class="white-part">${parts[0]}</span> <span class="blue-part">${parts.slice(1).join(' ')}</span>`;
                } else {
                    titleEl.innerHTML = `<span class="white-part">STAR</span> <span class="blue-part">${starData.designation}</span>`;
                }

                // 2. Рисуем объект в центре (как красивый фон для заглушки)
                if (starKey === 'black-hole') {
                    objectEl.innerHTML = `
                        <div class="accretion-disk"></div>
                        <div class="photon-ring-main"></div>
                        <div class="event-horizon"></div>
                    `;
                } else {
                    const colorClass = starData.sphereClass ? starData.sphereClass.replace('sphere-', '') : 'sun';
                    objectEl.innerHTML = `<div class="star-sphere ${colorClass}"></div>`;
                }
            }
        });
    </script>
</body>
</html>
