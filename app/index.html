<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cassandra — Planetary Habitability Assessment Project</title>
  <style>
    /* ============================================
       ПЕРЕМЕННЫЕ
       ============================================ */
    :root {
      --planet-size: 10vmin;
      --planet-border: 0.2vmin;
      --planet-gap: 0.35vmin;
      --planet-icon-size: 3vmin;
      --planet-label-size: 1.3vmin;
    }

    /* ============================================
       БАЗОВЫЕ СТИЛИ
       ============================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Roboto', sans-serif;
    }

    body {
      color: #e8ecff;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      background-color: #050816;
    }

    /* ============================================
       ФОН (ЗВЁЗДЫ И ТУМАННОСТЬ)
       ============================================ */
    .stars {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(1px 1px at 10% 10%, rgba(255, 255, 255, .9), transparent 50%),
        radial-gradient(1.5px 1.5px at 20% 30%, rgba(255, 255, 255, .7), transparent 50%),
        radial-gradient(1px 1px at 30% 70%, rgba(255, 255, 255, .8), transparent 50%),
        radial-gradient(2px 2px at 40% 20%, rgba(255, 255, 255, .6), transparent 50%),
        radial-gradient(1px 1px at 50% 50%, rgba(255, 255, 255, .9), transparent 50%),
        radial-gradient(1.5px 1.5px at 60% 80%, rgba(255, 255, 255, .7), transparent 50%),
        radial-gradient(1px 1px at 70% 40%, rgba(255, 255, 255, .8), transparent 50%),
        radial-gradient(2px 2px at 80% 90%, rgba(255, 255, 255, .5), transparent 50%),
        radial-gradient(1px 1px at 90% 15%, rgba(255, 255, 255, .9), transparent 50%),
        linear-gradient(180deg, #050816 0%, #0a0e27 50%, #131b3a 100%);
      background-size: 15vmin 15vmin, 20vmin 20vmin, 18vmin 18vmin, 25vmin 25vmin,
        16vmin 16vmin, 22vmin 22vmin, 19vmin 19vmin, 28vmin 28vmin,
        17vmin 17vmin, 100% 100%;
    }

    .milkyway {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .milkyway .band {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 280vmax;
      height: 25vmin;
      transform: translate(-50%, -50%) rotate(-28deg);
      background: linear-gradient(180deg,
          transparent,
          rgba(120, 160, 255, .08) 15%,
          rgba(190, 215, 255, .18) 35%,
          rgba(255, 255, 255, .25) 50%,
          rgba(190, 215, 255, .18) 65%,
          rgba(120, 160, 255, .08) 85%,
          transparent);
      filter: blur(1.5vmin);
    }

    /* ============================================
       КОНТЕЙНЕР И КОМПОНОВКА
       ============================================ */
    .landing-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100%;
      gap: 4vh;
    }

    /* ============================================
       ЛОГОТИП CASSANDRA
       ============================================ */
    .logo-wrapper {
      position: relative;
      display: inline-block;
      padding: 2vmin 0;
    }

    .dashboard-logo {
      font-size: 10vmin;
      font-weight: 800;
      letter-spacing: 1.5vmin;
      user-select: none;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .dashboard-logo .white-part {
      color: #ffffff;
      position: relative;
    }

    .dashboard-logo .blue-part {
      color: #4da6ff;
      text-shadow: 0 0 4vmin rgba(77, 166, 255, 0.6);
      position: relative;
    }

    /* ============================================
       ЛИНИИ ЭКГ (СЕРДЦЕБИЕНИЕ)
       ============================================ */
    .heartbeat-line {
      position: absolute;
      top: 50%;
      height: 10vmin;
      transform: translateY(-50%);
      pointer-events: none;
      overflow: visible;
      z-index: 2;
    }

    .heartbeat-line svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .heartbeat-path {
      fill: none;
      stroke-width: 0.35vmin;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawHeartbeat 15s linear infinite;
    }

    @keyframes drawHeartbeat {
      0% {
        stroke-dashoffset: 1000;
      }

      100% {
        stroke-dashoffset: -1000;
      }
    }

    .heartbeat-blue {
      left: 0;
      width: calc(6 / 9 * 100%);
    }

    .heartbeat-white {
      left: calc(6 / 9 * 100%);
      width: calc(3 / 9 * 100%);
    }

    .heartbeat-blue .heartbeat-path {
      stroke: url(#blueGradient);
      filter: drop-shadow(0 0 0.6vmin rgba(77, 166, 255, 0.9)) drop-shadow(0 0 1.2vmin rgba(77, 166, 255, 0.5));
    }

    .heartbeat-white .heartbeat-path {
      stroke: url(#whiteGradient);
      filter: drop-shadow(0 0 0.6vmin rgba(255, 255, 255, 0.9)) drop-shadow(0 0 1.2vmin rgba(255, 255, 255, 0.5));
    }

    /* ============================================
       ТЕКСТОВЫЕ ЭЛЕМЕНТЫ (ЗАГОЛОВОК, СЛОГАН)
       ============================================ */
    .project-title {
      font-size: 2.2vmin;
      font-weight: 400;
      letter-spacing: 0.4vmin;
      color: #8a94b8;
      text-transform: uppercase;
      text-align: center;
      margin-top: 1vh;
    }

    .title-divider {
      width: 60vmin;
      max-width: 600px;
      height: 0.1vmin;
      background: linear-gradient(90deg,
          transparent 0%,
          rgba(77, 166, 255, 0.4) 20%,
          rgba(77, 166, 255, 0.6) 50%,
          rgba(77, 166, 255, 0.4) 80%,
          transparent 100%);
      margin: 1.2vh auto;
      border: none;
      box-shadow: 0 0 0.5vmin rgba(77, 166, 255, 0.3);
    }

    .project-slogan {
      font-size: 2.5vmin;
      font-style: italic;
      color: #6a7498;
      text-align: center;
      margin-top: 0;
      letter-spacing: 0.1vmin;
    }

    /* ============================================
       КНОПКИ (LOG IN / SIGN UP)
       ============================================ */
    .buttons-container {
      display: flex;
      gap: 4vmin;
      margin-top: 8vh;
    }

    .btn {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      outline: none;
      width: var(--planet-size);
      height: var(--planet-size);
      border-radius: 50%;
      border: var(--planet-border) solid rgba(77, 166, 255, 0.6);
      background: rgba(10, 15, 40, 0.7);
      backdrop-filter: blur(1vmin);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.35vmin;
      position: relative;
      transition: all 0.3s ease;
      box-shadow:
        0 0 0.5vmin rgba(77, 166, 255, 0.3),
        inset 0 0 0.5vmin rgba(77, 166, 255, 0.2),
        0 0 1.5vmin rgba(77, 166, 255, 0.4);
      text-decoration: none;
    }

    .btn:hover {
      transform: scale(1.15);
      border-color: rgba(77, 166, 255, 1);
      box-shadow:
        0 0 1vmin rgba(77, 166, 255, 0.6),
        inset 0 0 1vmin rgba(77, 166, 255, 0.4),
        0 0 3vmin rgba(77, 166, 255, 0.8);
    }

    .btn:active {
      transform: scale(1.1);
    }

    .btn-icon {
      font-size: var(--planet-icon-size);
      line-height: 1;
      filter: drop-shadow(0 0 1vmin rgba(77, 166, 255, 0.5));
      margin-top: -1.3vmin;
      margin-bottom: 0.4vmin;
    }

    .btn-label {
      font-size: var(--planet-label-size);
      font-weight: 600;
      color: #e8ecff;
      text-transform: uppercase;
      letter-spacing: 0.05vmin;
      text-align: center;
      line-height: 1.2;
      text-shadow: 0 0 1vmin rgba(0, 0, 0, 0.8);
      padding: 0 0.8vmin;
      margin-top: 0.4vmin;
    }

    /* ============================================
       ФУТЕР (COPYRIGHT)
       ============================================ */
    .landing-footer {
      position: absolute;
      bottom: 0;
      width: 100%;
      text-align: center;
      padding-bottom: 3vmin;
    }

    .copyright {
      font-size: 1.4vmin;
      letter-spacing: 0.15vmin;
      color: #5a6488;
    }
  </style>
</head>

<body>

  <!-- ФОН -->
  <div class="stars"></div>
  <div class="milkyway">
    <div class="band"></div>
  </div>

  <!-- ОСНОВНОЙ КОНТЕЙНЕР -->
  <div class="landing-container">

    <!-- ЛОГОТИП С ЛИНИЯМИ ЭКГ -->
    <div class="logo-wrapper">
      <div class="dashboard-logo">
        <span class="white-part" data-wm-id="logo-cassan">CASSAN</span><span class="blue-part" data-wm-id="logo-dra">DRA</span>
      </div>

      <!-- Синяя линия над CASSAN -->
      <div class="heartbeat-line heartbeat-blue">
        <svg viewBox="0 0 600 100" preserveAspectRatio="none">
          <defs>
            <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#4da6ff" stop-opacity="0" />
              <stop offset="20%" stop-color="#4da6ff" stop-opacity="1" />
              <stop offset="80%" stop-color="#4da6ff" stop-opacity="1" />
              <stop offset="100%" stop-color="#4da6ff" stop-opacity="0" />
            </linearGradient>
          </defs>
          <path class="heartbeat-path" d="M 0,50 L 100,50 L 110,50 L 120,40 L 130,50 L 150,50
               L 157,55 L 163,15 L 173,85 L 182,50 L 202,50 L 215,35 L 228,50
               L 300,50 L 310,50 L 320,40 L 330,50 L 350,50
               L 357,55 L 363,15 L 373,85 L 382,50 L 402,50 L 415,35 L 428,50
               L 500,50 L 510,50 L 520,40 L 530,50 L 550,50
               L 557,55 L 563,15 L 573,85 L 582,50 L 600,50" />
        </svg>
      </div>

      <!-- Белая линия над DRA -->
      <div class="heartbeat-line heartbeat-white">
        <svg viewBox="0 0 300 100" preserveAspectRatio="none">
          <defs>
            <linearGradient id="whiteGradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
              <stop offset="20%" stop-color="#ffffff" stop-opacity="1" />
              <stop offset="80%" stop-color="#ffffff" stop-opacity="1" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
            </linearGradient>
          </defs>
          <path class="heartbeat-path" d="M 0,50 L 50,50 L 55,50 L 60,40 L 65,50 L 75,50
               L 78,55 L 82,15 L 87,85 L 92,50 L 102,50 L 108,35 L 115,50
               L 150,50 L 155,50 L 160,40 L 165,50 L 175,50
               L 178,55 L 182,15 L 187,85 L 192,50 L 202,50 L 208,35 L 215,50
               L 250,50 L 255,50 L 260,40 L 265,50 L 275,50
               L 278,55 L 282,15 L 287,85 L 292,50 L 300,50" />
        </svg>
      </div>
    </div>

    <!-- ЗАГОЛОВОК ПРОЕКТА -->
    <div class="project-title" data-wm-id="project-title">Planetary Habitability Assessment Project</div>

    <!-- РАЗДЕЛИТЕЛЬНАЯ ЛИНИЯ -->
    <div class="title-divider"></div>

    <!-- СЛОГАН -->
    <div class="project-slogan" data-wm-id="project-slogan">«We Find a New Home Among the Stars»</div>

    <!-- КНОПКИ ВХОДА И РЕГИСТРАЦИИ -->
    <div class="buttons-container">
      <a href="login.html" class="btn" data-wm-id="btn-login">
        <span class="btn-icon">🔭</span>
        <span class="btn-label">Log In</span>
      </a>
      <a href="signup.html" class="btn" data-wm-id="btn-signup">
        <span class="btn-icon">📡</span>
        <span class="btn-label">Sign Up</span>
      </a>
    </div>
  </div>

  <!-- ФУТЕР -->
  <footer class="landing-footer">
    <div class="copyright" data-wm-id="footer-copyright">Evknopia © 2026</div>
  </footer>

</body>

</html>
