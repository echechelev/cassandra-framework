<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cassandra — Mission Terminal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Roboto', sans-serif;
    }

    body {
      color: #e8ecff;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    .stars {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(1px 1px at 10% 10%, rgba(255, 255, 255, .9), transparent 50%),
        radial-gradient(1.5px 1.5px at 20% 30%, rgba(255, 255, 255, .7), transparent 50%),
        radial-gradient(1px 1px at 30% 70%, rgba(255, 255, 255, .8), transparent 50%),
        radial-gradient(2px 2px at 40% 20%, rgba(255, 255, 255, .6), transparent 50%),
        radial-gradient(1px 1px at 50% 50%, rgba(255, 255, 255, .9), transparent 50%),
        radial-gradient(1.5px 1.5px at 60% 80%, rgba(255, 255, 255, .7), transparent 50%),
        radial-gradient(1px 1px at 70% 40%, rgba(255, 255, 255, .8), transparent 50%),
        radial-gradient(2px 2px at 80% 90%, rgba(255, 255, 255, .5), transparent 50%),
        radial-gradient(1px 1px at 90% 15%, rgba(255, 255, 255, .9), transparent 50%),
        linear-gradient(180deg, #050816 0%, #0a0e27 50%, #131b3a 100%);
      background-size: 15vmin 15vmin, 20vmin 20vmin, 18vmin 18vmin, 25vmin 25vmin,
        16vmin 16vmin, 22vmin 22vmin, 19vmin 19vmin, 28vmin 28vmin,
        17vmin 17vmin, 100% 100%;
    }

    .milkyway {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .milkyway .band {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 280vmax;
      height: 25vmin;
      transform: translate(-50%, -50%) rotate(-28deg);
      background: linear-gradient(180deg,
          transparent,
          rgba(120, 160, 255, .08) 15%,
          rgba(190, 215, 255, .18) 35%,
          rgba(255, 255, 255, .25) 50%,
          rgba(190, 215, 255, .18) 65%,
          rgba(120, 160, 255, .08) 85%,
          transparent);
      filter: blur(1.5vmin);
    }

    .terminal-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100%;
      padding: 2vmin 0;
      box-sizing: border-box;
    }

    .terminal-card {
      width: 90%;
      max-width: 80vmin;
      padding: 4vmin;
      background: rgba(10, 15, 40, 0.75);
      border: 0.1vmin solid rgba(77, 166, 255, 0.3);
      border-radius: 1.5vmin;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 4vmin rgba(77, 166, 255, 0.15), inset 0 0 1.5vmin rgba(77, 166, 255, 0.05);
      position: relative;
      z-index: 2;
    }

    .terminal-header {
      font-size: 2vmin;
      font-weight: 800;
      letter-spacing: 0.3vmin;
      margin-bottom: 3vmin;
      padding-bottom: 1.5vmin;
      border-bottom: 0.1vmin dashed rgba(77, 166, 255, 0.3);
      display: flex;
      align-items: center;
      gap: 1vmin;
    }

    .terminal-header .white-part { color: #ffffff; }
    .terminal-header .blue-part {
      color: #4da6ff;
      text-shadow: 0 0 1.5vmin rgba(77, 166, 255, 0.6);
    }
    .terminal-header .sub {
      color: #7a86b8;
      font-weight: 400;
      margin-left: 1vmin;
    }

    .status-dot {
      width: 1.2vmin;
      height: 1.2vmin;
      background-color: #2ecc71;
      border-radius: 50%;
      box-shadow: 0 0 1vmin #2ecc71;
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .terminal-body {
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.6vmin;
      line-height: 1.8;
      min-height: 40vmin;
      margin-bottom: 2vmin;
    }

    .line {
      margin: 0.8vmin 0;
      opacity: 0;
      animation: fadeInLine 0.3s forwards;
    }

    @keyframes fadeInLine {
      to { opacity: 1; }
    }

    .status-ok { color: #2ecc71; }
    .status-warning { color: #f39c12; }
    .status-info { color: #4da6ff; font-weight: bold; }
    .status-data { color: #ffffff; }
    .status-dim { color: #7a86b8; }

    .progress-bar {
      width: 100%;
      height: 0.6vmin;
      background: rgba(77, 166, 255, 0.2);
      margin: 1.5vmin 0;
      border-radius: 0.3vmin;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4da6ff, #2ecc71);
      width: 0%;
      transition: width 0.3s ease;
      box-shadow: 0 0 1vmin rgba(77, 166, 255, 0.5);
    }

    .cursor {
      display: inline-block;
      font-size: 1.6vmin;
      animation: blink 1s step-end infinite;
      margin-left: 0.2vmin;
      color: #4da6ff;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .terminal-footer {
      text-align: center;
      padding-top: 2vmin;
      border-top: 0.1vmin dashed rgba(77, 166, 255, 0.3);
    }

    .telemetry {
      color: #4da6ff;
      font-family: 'Courier New', monospace;
      font-size: 1.3vmin;
      text-transform: uppercase;
      letter-spacing: 0.2vmin;
      text-shadow: 0 0 0.8vmin rgba(77, 166, 255, 0.4);
      margin-bottom: 1vmin;
    }

    .telemetry::after {
      content: "█";
      animation: blink 1s step-end infinite;
      margin-left: 0.4vmin;
    }

    .copyright {
      font-size: 1.4vmin;
      letter-spacing: 0.15vmin;
      color: #5a6488;
    }

    #satellite {
      position: fixed;
      top: 5vmin;
      right: 5vmin;
      z-index: 1;
      pointer-events: none;
      filter: drop-shadow(0 0 0.8vmin rgba(77, 166, 255, 0.4));
    }

    .radio-wave {
      fill: none;
      stroke: #4da6ff;
      stroke-width: 2;
      opacity: 0;
      transform-origin: 50px 30px;
      animation: pulse-wave 2s infinite ease-out;
      pointer-events: none;
    }

    .radio-wave:nth-of-type(1) { animation-delay: 0s; }
    .radio-wave:nth-of-type(2) { animation-delay: 0.6s; }
    .radio-wave:nth-of-type(3) { animation-delay: 1.2s; }

    @keyframes pulse-wave {
      0% { transform: scale(0.5); opacity: 0.8; stroke-width: 3; }
      100% { transform: scale(3.5); opacity: 0; stroke-width: 0.5; }
    }

    .launch-btn {
      width: 100%;
      padding: 1.5vmin;
      margin-top: 2vmin;
      border-radius: 0.8vmin;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #1e5fbf, #4da6ff);
      color: white;
      font-weight: 700;
      font-size: 1.6vmin;
      letter-spacing: 0.1vmin;
      text-transform: uppercase;
      box-shadow: 0 0 2vmin rgba(77, 166, 255, 0.3);
      transition: transform 0.1s ease, box-shadow 0.3s ease;
      display: none;
    }

    .launch-btn:hover:not(:disabled) { box-shadow: 0 0 3vmin rgba(77, 166, 255, 0.6); }
    .launch-btn:active:not(:disabled) { transform: translateY(0.2vmin) scale(0.98); }
    .launch-btn.visible { display: block; animation: fadeInLine 0.5s forwards; }
  </style>
</head>
<body>

  <div class="stars"></div>
  <div class="milkyway"><div class="band"></div></div>

  <div id="satellite">
    <svg width="8vmin" height="5.3vmin" viewBox="0 0 100 60">
      <circle cx="50" cy="30" r="15" class="radio-wave" />
      <circle cx="50" cy="30" r="15" class="radio-wave" />
      <circle cx="50" cy="30" r="15" class="radio-wave" />
      <rect x="5" y="15" width="30" height="30" rx="2" fill="#1e5fbf" stroke="#4da6ff" stroke-width="2" />
      <rect x="65" y="15" width="30" height="30" rx="2" fill="#1e5fbf" stroke="#4da6ff" stroke-width="2" />
      <line x1="15" y1="15" x2="15" y2="45" stroke="#4da6ff" stroke-width="1" opacity="0.5" />
      <line x1="25" y1="15" x2="25" y2="45" stroke="#4da6ff" stroke-width="1" opacity="0.5" />
      <line x1="75" y1="15" x2="75" y2="45" stroke="#4da6ff" stroke-width="1" opacity="0.5" />
      <line x1="85" y1="15" x2="85" y2="45" stroke="#4da6ff" stroke-width="1" opacity="0.5" />
      <rect x="35" y="20" width="30" height="20" rx="4" fill="#e8ecff" stroke="#4da6ff" stroke-width="2" />
      <line x1="50" y1="20" x2="50" y2="5" stroke="#9fb0e8" stroke-width="2" />
      <circle cx="50" cy="5" r="3" fill="#4da6ff" />
      <circle cx="42" cy="30" r="2" fill="#2ecc71">
        <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite" />
      </circle>
    </svg>
  </div>

  <div class="terminal-wrapper">
    <div class="terminal-card">
      <div class="terminal-header">
        <span class="status-dot"></span>
        <span class="white-part">CASSAN</span><span class="blue-part">DRA</span>
        <span class="sub">// MISSION_TERMINAL v2.0</span>
      </div>

      <div class="terminal-body" id="terminal-output"></div>
      <div class="cursor">_</div>

      <button class="launch-btn" id="launch-btn">ЗАПУСТИТЬ МИССИЮ</button>

      <div class="terminal-footer">
        <div class="telemetry" id="telemetry">> SYSTEM INITIALIZING...</div>
        <div class="copyright">Evknopia © 2026</div>
      </div>
    </div>
  </div>

  <script>
    const terminalOutput = document.getElementById('terminal-output');
    const launchBtn = document.getElementById('launch-btn');
    const telemetry = document.getElementById('telemetry');

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    // Печать одной строки
    async function typeLine(text, className = 'status-info', speed = 30) {
      const line = document.createElement('div');
      line.className = `line ${className}`;
      terminalOutput.appendChild(line);
      for (let i = 0; i < text.length; i++) {
        line.textContent += text[i];
        await sleep(speed + Math.random() * 20);
      }
    }

    // Анимация прогресс-бара
    async function showProgressBar(label) {
      const container = document.createElement('div');
      container.className = 'line';
      container.innerHTML = `
        <div class="status-dim">${label}</div>
        <div class="progress-bar"><div class="progress-fill" id="progress-${Date.now()}"></div></div>
      `;
      terminalOutput.appendChild(container);
      
      const fill = container.querySelector('.progress-fill');
      for (let i = 0; i <= 100; i += 5) {
        fill.style.width = `${i}%`;
        await sleep(30);
      }
    }

    // Универсальная функция для запуска модуля (Фазы)
    async function runPhase(phaseTitle, dataPairs) {
      // 1. Заголовок фазы
      await typeLine(`[ИНИЦИАЛИЗАЦИЯ] ${phaseTitle}`, 'status-info', 25);
      await sleep(200);
      
      // 2. Прогресс-бар
      await showProgressBar('Загрузка модуля...');
      await sleep(400);

      // 3. Вывод данных
      for (const [key, value] of Object.entries(dataPairs)) {
        await typeLine(`${key}: `, 'status-dim', 15);
        await typeLine(value, 'status-data', 40);
        await sleep(300);
      }
      
      // Небольшая пауза перед следующей фазой
      await sleep(500);
    }

    // Главная функция
    async function startTerminal() {
      terminalOutput.innerHTML = '';
      launchBtn.classList.remove('visible');
      telemetry.textContent = '> SYSTEM INITIALIZING...';

      // Приветствие
      await typeLine('Приветствую, Командир. Запуск протокола миссии...', 'status-ok', 30);
      await sleep(600);

      // ФАЗА 1: Данные карты
      await runPhase('Данные: Карта 1', {
        'Планета запуска': 'Земля',
        'Пункт назначения': 'Марс'
      });

      // ФАЗА 2: Цель миссии
      await runPhase('Цель миссии', {
        'Цель': 'Колонизация'
      });

      // ФАЗА 3: Конфигурация корабля
      await runPhase('Конфигурация корабля', {
        'Тип судна': 'Ковчег',
        'Двигатели': 'Ионные (0.9c)',
        'Экипаж': 'Крио-сон (1200 чел.)'
      });

      // ФАЗА 4: Статус систем
      await runPhase('Диагностика систем', {
        'Сенсоры': 'Стандартный массив',
        'Щиты': 'Средняя защита',
        'ИИ': 'Адаптивный'
      });

      // Финал
      const sep = document.createElement('div');
      sep.className = 'line status-dim';
      sep.textContent = '════════════════════════════════════════════';
      terminalOutput.appendChild(sep);
      await sleep(300);

      await typeLine('[ГОТОВО] Все системы активны. Миссия готова к запуску.', 'status-ok', 40);
      await sleep(500);

      telemetry.textContent = '> MISSION READY. AWAITING LAUNCH COMMAND';
      launchBtn.classList.add('visible');
    }

    launchBtn.addEventListener('click', () => {
      telemetry.textContent = '> LAUNCHING MISSION...';
      launchBtn.disabled = true;
      launchBtn.textContent = 'ЗАПУСК...';
      
      setTimeout(() => {
        alert('🚀 Миссия запущена! (Здесь будет переход к следующей карте)');
      }, 1000);
    });

    window.onload = () => {
      setTimeout(startTerminal, 500);
    };
  </script>
</body>
</html>
