<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cassandra — Access Restoration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', sans-serif;
        }

        body {
            color: #e8ecff;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .stars {
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(1px 1px at 10% 10%, rgba(255, 255, 255, .9), transparent 50%),
                radial-gradient(1.5px 1.5px at 20% 30%, rgba(255, 255, 255, .7), transparent 50%),
                radial-gradient(1px 1px at 30% 70%, rgba(255, 255, 255, .8), transparent 50%),
                radial-gradient(2px 2px at 40% 20%, rgba(255, 255, 255, .6), transparent 50%),
                radial-gradient(1px 1px at 50% 50%, rgba(255, 255, 255, .9), transparent 50%),
                radial-gradient(1.5px 1.5px at 60% 80%, rgba(255, 255, 255, .7), transparent 50%),
                radial-gradient(1px 1px at 70% 40%, rgba(255, 255, 255, .8), transparent 50%),
                radial-gradient(2px 2px at 80% 90%, rgba(255, 255, 255, .5), transparent 50%),
                radial-gradient(1px 1px at 90% 15%, rgba(255, 255, 255, .9), transparent 50%),
                linear-gradient(180deg, #050816 0%, #0a0e27 50%, #131b3a 100%);
            background-size: 15vmin 15vmin, 20vmin 20vmin, 18vmin 18vmin, 25vmin 25vmin,
                16vmin 16vmin, 22vmin 22vmin, 19vmin 19vmin, 28vmin 28vmin,
                17vmin 17vmin, 100% 100%;
        }

        .milkyway {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .milkyway .band {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 280vmax;
            height: 25vmin;
            transform: translate(-50%, -50%) rotate(-28deg);
            background: linear-gradient(180deg,
                    transparent,
                    rgba(120, 160, 255, .08) 15%,
                    rgba(190, 215, 255, .18) 35%,
                    rgba(255, 255, 255, .25) 50%,
                    rgba(190, 215, 255, .18) 65%,
                    rgba(120, 160, 255, .08) 85%,
                    transparent);
            filter: blur(1.5vmin);
        }

        .hidden {
            display: none !important;
        }

        .login-card {
            width: 90%;
            max-width: 45vmin;
            padding: 4vmin;
            background: rgba(10, 15, 40, 0.75);
            border: 0.1vmin solid rgba(77, 166, 255, 0.3);
            border-radius: 1.5vmin;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 4vmin rgba(77, 166, 255, 0.15), inset 0 0 1.5vmin rgba(77, 166, 255, 0.05);
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .login-logo {
            font-size: 3.5vmin;
            font-weight: 800;
            letter-spacing: 0.5vmin;
            margin-bottom: 1vmin;
        }

        .login-logo .white-part {
            color: #ffffff;
        }

        .login-logo .blue-part {
            color: #4da6ff;
            text-shadow: 0 0 1.5vmin rgba(77, 166, 255, 0.6);
        }

        .login-sub {
            font-size: 1.5vmin;
            color: #7a86b8;
            margin-bottom: 3vmin;
            letter-spacing: 0.1vmin;
        }

        .input-group {
            margin-bottom: 2vmin;
            text-align: left;
        }

        .input-label {
            display: block;
            font-size: 1.3vmin;
            color: #9fb0e8;
            margin-bottom: 0.8vmin;
            letter-spacing: 0.1vmin;
            text-transform: uppercase;
        }

        .input-field {
            width: 100%;
            padding: 1.5vmin 1.6vmin;
            border-radius: 0.8vmin;
            border: 1px solid rgba(77, 166, 255, 0.3);
            background: rgba(5, 8, 22, 0.8);
            color: #fff;
            font-size: 1.6vmin;
            outline: none;
            transition: 0.3s;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .input-field {
            padding-right: 4.5vmin;
        }

        select.input-field {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            cursor: pointer;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234da6ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1.6vmin center;
            background-size: 1.6vmin;
        }

        .input-field:focus {
            border-color: #4da6ff;
            box-shadow: 0 0 1.5vmin rgba(77, 166, 255, 0.2);
        }

        .input-field::placeholder {
            color: #4a5480;
        }

        .input-field[readonly] {
            cursor: not-allowed;
            opacity: 0.7;
            background: rgba(5, 8, 22, 0.95);
        }

        .input-field.error {
            border-color: #e74c3c;
            box-shadow: 0 0 1.5vmin rgba(231, 76, 60, 0.2);
        }

        .auth-error {
            display: none;
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid rgba(231, 76, 60, 0.4);
            color: #ffadad;
            padding: 1.2vmin;
            border-radius: 0.8vmin;
            margin-bottom: 2vmin;
            font-size: 1.3vmin;
            font-weight: 600;
        }

        .auth-error.visible {
            display: block;
            animation: fadeInUp 0.3s ease;
        }

        .toggle-password {
            position: absolute;
            right: 1.5vmin;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4da6ff;
            transition: opacity 0.3s;
        }

        .toggle-password svg {
            width: 1.8vmin;
            height: 1.8vmin;
            fill: currentColor;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .toggle-password:hover svg {
            opacity: 1;
        }

        .login-btn {
            width: 100%;
            padding: 1.5vmin;
            margin-top: 1vmin;
            border-radius: 0.8vmin;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #1e5fbf, #4da6ff);
            color: white;
            font-weight: 700;
            font-size: 1.6vmin;
            letter-spacing: 0.1vmin;
            text-transform: uppercase;
            box-shadow: 0 0 2vmin rgba(77, 166, 255, 0.3);
            transition: transform 0.1s ease, box-shadow 0.3s ease;
        }

        .login-btn:active:not(:disabled) {
            transform: translateY(0.2vmin) scale(0.98);
            box-shadow: 0 0 1vmin rgba(77, 166, 255, 0.3);
        }

        .login-btn:hover:not(:disabled) {
            box-shadow: 0 0 3vmin rgba(77, 166, 255, 0.6);
        }

        .login-btn:disabled:not(.processing) {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(0.8);
            box-shadow: none;
        }

        .login-btn.processing {
            background: #1e5fbf;
            opacity: 0.9;
            cursor: wait;
            animation: pulse-btn 1.5s infinite ease-in-out;
        }

        .login-btn.processing:disabled {
            opacity: 0.9;
            filter: none;
            transform: none;
        }

        @keyframes pulse-btn {
            0% {
                box-shadow: 0 0 1.5vmin rgba(77, 166, 255, 0.3);
            }

            50% {
                box-shadow: 0 0 4vmin rgba(77, 166, 255, 0.9);
            }

            100% {
                box-shadow: 0 0 1.5vmin rgba(77, 166, 255, 0.3);
            }
        }

        .operator-summary {
            background: rgba(5, 8, 22, 0.6);
            border: 1px solid rgba(77, 166, 255, 0.2);
            border-radius: 0.8vmin;
            padding: 2vmin;
            margin-bottom: 2vmin;
            text-align: left;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1vmin 0;
            border-bottom: 1px solid rgba(77, 166, 255, 0.1);
            font-size: 1.5vmin;
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-label {
            color: #7a86b8;
            text-transform: uppercase;
            letter-spacing: 0.1vmin;
        }

        .summary-value {
            color: #e8ecff;
            font-weight: 600;
            text-align: right;
        }

        .summary-value.highlight {
            color: #4da6ff;
            text-shadow: 0 0 1vmin rgba(77, 166, 255, 0.5);
        }

        .login-footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: center;
            padding-bottom: 2vmin;
        }

        .copyright {
            margin-top: 4vmin;
            font-size: 1.4vmin;
            letter-spacing: 0.15vmin;
            color: #5a6488;
        }

        .telemetry {
            color: #4da6ff;
            font-family: 'Courier New', monospace;
            margin-bottom: 0.8vmin;
            font-size: 1.3vmin;
            text-transform: uppercase;
            letter-spacing: 0.2vmin;
            text-shadow: 0 0 0.8vmin rgba(77, 166, 255, 0.4);
        }

        .telemetry::after {
            content: "█";
            animation: blink 1s step-end infinite;
            margin-left: 0.4vmin;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* СПУТНИК */
        #satellite {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 0 0.8vmin rgba(231, 76, 60, 0.5));
            transition: filter 0.8s ease;
        }

        .radio-wave {
            fill: none;
            stroke: #e74c3c;
            stroke-width: 2;
            opacity: 0;
            transform-origin: 50px 30px;
            animation: pulse-wave 2s infinite ease-out;
            pointer-events: none;
            transition: stroke 0.8s ease;
        }

        /* Красное тело спутника по умолчанию */
        .sat-part {
            fill: #e74c3c !important;
            stroke: #e74c3c !important;
            transition: fill 0.8s ease, stroke 0.8s ease;
        }

        /* ============================================
           СОСТОЯНИЕ: СВЯЗЬ ВОССТАНОВЛЕНА (БЕЛОЕ ТЕЛО + СИНИЕ ВОЛНЫ)
           ============================================ */
        body.signal-restored #satellite {
            filter: drop-shadow(0 0 0.8vmin rgba(77, 166, 255, 0.5));
        }

        body.signal-restored .radio-wave {
            stroke: #4da6ff;
        }

        body.signal-restored .sat-part {
            fill: #ffffff !important;
            stroke: #ffffff !important;
        }

        .radio-wave:nth-of-type(1) {
            animation-delay: 0s;
        }

        .radio-wave:nth-of-type(2) {
            animation-delay: 0.6s;
        }

        .radio-wave:nth-of-type(3) {
            animation-delay: 1.2s;
        }

        @keyframes pulse-wave {
            0% {
                transform: scale(0.5);
                opacity: 0.8;
                stroke-width: 3;
            }

            100% {
                transform: scale(3.5);
                opacity: 0;
                stroke-width: 0.5;
            }
        }

        .login-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            padding: 2vmin 0;
            box-sizing: border-box;
        }

        /* ============================================
           УГЛОВЫЕ КНОПКИ НАВИГАЦИИ
           ============================================ */
        .corner-nav {
            position: fixed;
            bottom: 3vmin;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 4vmin;
            pointer-events: none;
            z-index: 10;
        }

        .nav-circle-btn {
            pointer-events: auto;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            outline: none;
            width: 10vmin;
            height: 10vmin;
            border-radius: 50%;
            border: 0.2vmin solid rgba(77, 166, 255, 0.6);
            background: rgba(10, 15, 40, 0.7);
            backdrop-filter: blur(1vmin);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.35vmin;
            position: relative;
            transition: all 0.3s ease;
            box-shadow:
                0 0 0.5vmin rgba(77, 166, 255, 0.3),
                inset 0 0 0.5vmin rgba(77, 166, 255, 0.2),
                0 0 1.5vmin rgba(77, 166, 255, 0.4);
            text-decoration: none;
        }

        .nav-circle-btn:hover {
            transform: scale(1.15);
            border-color: rgba(77, 166, 255, 1);
            box-shadow:
                0 0 1vmin rgba(77, 166, 255, 0.6),
                inset 0 0 1vmin rgba(77, 166, 255, 0.4),
                0 0 3vmin rgba(77, 166, 255, 0.8);
        }

        .nav-circle-btn:active {
            transform: scale(0.95);
        }

        .nav-icon {
            font-size: 3vmin;
            line-height: 1;
            filter: drop-shadow(0 0 1vmin rgba(77, 166, 255, 0.5));
            margin-top: -1.3vmin;
            margin-bottom: 0.7vmin;
        }

        .nav-label {
            font-size: 1.3vmin;
            font-weight: 600;
            color: #e8ecff;
            text-transform: uppercase;
            letter-spacing: 0.05vmin;
            text-align: center;
            line-height: 1.2;
            text-shadow: 0 0 1vmin rgba(0, 0, 0, 0.8);
        }

        html.signal-restored .login-card>.login-logo,
        html.signal-restored #page-subtitle,
        body.signal-restored .login-card>.login-logo,
        body.signal-restored #page-subtitle {
            display: none !important;
        }
    </style>

</head>

<body>

    <div class="stars"></div>
    <div class="milkyway">
        <div class="band"></div>
    </div>

    <div id="satellite">
        <svg width="8vmin" height="5.3vmin" viewBox="0 0 100 60">
            <circle cx="50" cy="30" r="15" class="radio-wave" />
            <circle cx="50" cy="30" r="15" class="radio-wave" />
            <circle cx="50" cy="30" r="15" class="radio-wave" />

            <rect x="5" y="15" width="30" height="30" rx="2" fill="#1e5fbf" stroke="#4da6ff" stroke-width="2" />
            <rect x="65" y="15" width="30" height="30" rx="2" fill="#1e5fbf" stroke="#4da6ff" stroke-width="2" />
            <line x1="15" y1="15" x2="15" y2="45" stroke="#4da6ff" stroke-width="1" opacity="0.5" />
            <line x1="25" y1="15" x2="25" y2="45" stroke="#4da6ff" stroke-width="1" opacity="0.5" />
            <line x1="75" y1="15" x2="75" y2="45" stroke="#4da6ff" stroke-width="1" opacity="0.5" />
            <line x1="85" y1="15" x2="85" y2="45" stroke="#4da6ff" stroke-width="1" opacity="0.5" />

            <!-- БЕЗ инлайн-цветов! Цвета управляются через CSS класс .sat-part -->
            <rect class="sat-part" x="35" y="20" width="30" height="20" rx="4" stroke-width="2" />
            <line class="sat-part" x1="50" y1="20" x2="50" y2="5" stroke-width="2" />
            <circle class="sat-part" cx="50" cy="5" r="3" />

            <circle cx="42" cy="30" r="2" fill="#ffffff">
                <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite" />
            </circle>
        </svg>
    </div>

    <div class="login-wrapper">

        <div class="login-card">
            <div class="login-logo">
                <span class="white-part">CASSAN</span><span class="blue-part">DRA</span>
            </div>

            <div class="login-sub" id="page-subtitle" data-wm-id="restoration-page-subtitle">Access Restoration Protocol
            </div>

            <div class="auth-error" id="restoration-error" data-wm-id="restoration-error-message">
                ⚠️ Restoration data invalid
            </div>

            <!-- ЕДИНАЯ ФОРМА ВОССТАНОВЛЕНИЯ -->
            <form id="restoration-form" novalidate>

                <!-- 1. Callsign -->
                <div class="input-group">
                    <label class="input-label" for="callsign">Callsign</label>
                    <input type="text" id="callsign" class="input-field" placeholder="Enter callsign" minlength="4"
                        maxlength="100" data-wm-id="restoration-callsign-input" autocomplete="off">
                </div>

                <!-- 2. Recovery Cipher -->
                <div class="input-group">
                    <label class="input-label" for="recovery-cipher">Recovery Cipher</label>
                    <input type="text" id="recovery-cipher" class="input-field" placeholder="Enter recovery cipher"
                        minlength="4" maxlength="100" data-wm-id="restoration-recovery-cipher-input" autocomplete="off">
                </div>

                <!-- 3. New Access Code -->
                <div class="input-group">
                    <label class="input-label" for="new-access-code">New Access Code</label>
                    <div class="password-wrapper">
                        <input type="password" id="new-access-code" class="input-field"
                            placeholder="Enter new access code" minlength="4" maxlength="30" autocomplete="new-password"
                            data-wm-id="restoration-new-access-code-input">
                        <button type="button" class="toggle-password" data-target="new-access-code"
                            data-wm-id="restoration-toggle-new-access-code">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- 4. Confirm Access Code -->
                <div class="input-group">
                    <label class="input-label" for="confirm-access-code">Confirm Access Code</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirm-access-code" class="input-field"
                            placeholder="Confirm access code" minlength="4" maxlength="30" autocomplete="new-password"
                            data-wm-id="restoration-confirm-access-code-input">
                        <button type="button" class="toggle-password" data-target="confirm-access-code"
                            data-wm-id="restoration-toggle-confirm-access-code">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Кнопка восстановления -->
                <button type="submit" class="login-btn" id="restore-btn" data-wm-id="restoration-restore-btn" disabled>
                    RESTORE ACCESS
                </button>
            </form>

            <!-- ЭКРАН УСПЕХА (Скрыт по умолчанию) -->
            <div id="success-screen" class="hidden">

                <div style="color: #2ecc71; font-size: 1.6vmin; font-weight: 700; margin-bottom: 1.5vmin; letter-spacing: 0.15vmin;"
                    data-wm-id="restoration-success-message">
                    ✅ Access Protocol Verified
                </div>

                <div class="login-logo" style="font-size: 2.8vmin; margin-bottom: 2vmin;"
                    data-wm-id="restoration-success-logo">
                    <span class="white-part">ACCESS</span><span class="blue-part"> RESTORED</span>
                </div>

                <div class="operator-summary" data-wm-id="restoration-summary">
                    <div class="summary-row">
                        <span class="summary-label">Callsign:</span>
                        <span class="summary-value" id="sum-callsign" data-wm-id="sum-callsign">KNOPA</span>
                    </div>
                    <div class="summary-row">
                        <span class="summary-label">Role:</span>
                        <span class="summary-value" id="sum-role" data-wm-id="sum-role">️ Pilot</span>
                    </div>
                    <div class="summary-row">
                        <span class="summary-label">Function:</span>
                        <span class="summary-value" id="sum-function" data-wm-id="sum-function">Space Navigation</span>
                    </div>
                    <div class="summary-row">
                        <span class="summary-label">Operator ID:</span>
                        <span class="summary-value" id="sum-id" data-wm-id="sum-id">769-1A</span>
                    </div>
                    <div class="summary-row">
                        <span class="summary-label">New Access Code:</span>
                        <span class="summary-value highlight" id="sum-new-code"
                            data-wm-id="sum-new-code">NEW_CODE</span>
                    </div>
                </div>
            </div>
        </div>

        <footer class="login-footer">
            <div class="telemetry" data-wm-id="system-telemetry">> SYSTEM READY. AWAITING RESTORATION PROTOCOL</div>
            <div class="copyright">Evknopia © 2026</div>
        </footer>

        <!-- УГЛОВЫЕ КНОПКИ НАВИГАЦИИ -->
        <div class="corner-nav">
            <a href="login.html" class="nav-circle-btn" data-wm-id="btn-login">
                <span class="nav-icon">🔭</span>
                <span class="nav-label">Log In</span>
            </a>
            <a href="signup.html" class="nav-circle-btn" data-wm-id="btn-signup">
                <span class="nav-icon">📡</span>
                <span class="nav-label">Sign Up</span>
            </a>
        </div>

    </div>

    <script src="data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            let isProcessing = false;

            // === 1. SATELLITE ANIMATION ===
            const satellite = document.getElementById('satellite');
            let x = Math.random() * (window.innerWidth - 60);
            let y = Math.random() * (window.innerHeight - 40);
            let dx = window.innerWidth * 0.0008;
            let dy = window.innerHeight * 0.0008;

            function animateSatellite() {
                const rect = satellite.getBoundingClientRect();
                if (x + rect.width > window.innerWidth || x < 0) dx = -dx;
                if (y + rect.height > window.innerHeight || y < 0) dy = -dy;
                x += dx; y += dy;
                satellite.style.transform = `translate(${x}px, ${y}px)`;
                requestAnimationFrame(animateSatellite);
            }
            requestAnimationFrame(animateSatellite);

            // === 2. VARIABLES ===
            const callsignInput = document.getElementById('callsign');
            const recoveryCipherInput = document.getElementById('recovery-cipher');
            const newAccessCodeInput = document.getElementById('new-access-code');
            const confirmAccessCodeInput = document.getElementById('confirm-access-code');
            const restoreBtn = document.getElementById('restore-btn');
            const telemetryText = document.querySelector('.telemetry');
            const errorBlock = document.getElementById('restoration-error');

            const restorationForm = document.getElementById('restoration-form');
            const successScreen = document.getElementById('success-screen');

            // === 3. PASSWORD TOGGLE ===
            function togglePassword(inputId) {
                const input = document.getElementById(inputId);
                input.type = input.type === 'password' ? 'text' : 'password';
            }
            document.querySelectorAll('.toggle-password').forEach(btn => {
                btn.addEventListener('click', function () {
                    togglePassword(this.getAttribute('data-target'));
                });
            });

            // === 4. INPUT VALIDATION ===
            callsignInput.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
                checkFormState();
            });

            recoveryCipherInput.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[^a-zA-Z]/g, '').toUpperCase();
                checkFormState();
            });

            function filterAccessCode(e) {
                e.target.value = e.target.value.replace(/[^a-zA-Z0-9_]/g, '');
                checkFormState();
            }
            newAccessCodeInput.addEventListener('input', filterAccessCode);
            confirmAccessCodeInput.addEventListener('input', filterAccessCode);

            [callsignInput, recoveryCipherInput, newAccessCodeInput, confirmAccessCodeInput].forEach(el => {
                el.addEventListener('click', () => {
                    if (isProcessing) return;
                    errorBlock.classList.remove('visible');
                    telemetryText.style.color = '#4da6ff';
                    telemetryText.innerHTML = '> SYSTEM READY. AWAITING RESTORATION PROTOCOL';
                });
            });

            function checkFormState() {
                const isCallsignValid = callsignInput.value.length >= 4 && callsignInput.value.length <= 100;
                const isRecoveryValid = recoveryCipherInput.value.length >= 4 && recoveryCipherInput.value.length <= 100;
                const isNewAccessValid = newAccessCodeInput.value.length >= 4 && newAccessCodeInput.value.length <= 30;
                const isConfirmValid = confirmAccessCodeInput.value.length >= 4 && confirmAccessCodeInput.value.length <= 30;

                restoreBtn.disabled = !(isCallsignValid && isRecoveryValid && isNewAccessValid && isConfirmValid);
            }

            // === 6. FORM SUBMIT HANDLER ===
            function handleRestoration(event) {
                event.preventDefault();
                if (isProcessing) return; // Защита от двойного клика

                isProcessing = true;
                errorBlock.classList.remove('visible');

                // 🚀 ДОБАВЛЕНО: Состояние обработки (мерцание)
                restoreBtn.classList.add('processing');
                restoreBtn.disabled = true;
                restoreBtn.textContent = 'VERIFYING PROTOCOLS...';
                // Телеметрия НЕ меняется, остаётся "> SYSTEM READY..." до финального результата

                // ⏱️ ИЗМЕНЕНО: Тайминг с 1500 на 2000 мс для синхронизации со всеми страницами
                setTimeout(() => {
                    const callsign = callsignInput.value.trim();
                    const cipher = recoveryCipherInput.value.trim();
                    const newCode = newAccessCodeInput.value;
                    const confirmCode = confirmAccessCodeInput.value;

                    // 1. ПРОВЕРКА ИБ: Позывной должен быть строго KNOPA
                    if (callsign !== 'KNOPA') {
                        showError('⚠️ Restoration unavailable. Only operator KNOPA is eligible for access recovery.');
                        return;
                    }

                    // 2. Проверка совпадения новых паролей (единая ошибка ИБ)
                    if (newCode !== confirmCode) {
                        showError('⚠️ Security protocol failed. Invalid credentials provided.');
                        return;
                    }

                    // 3. Проверка жестко заданного нового пароля (единая ошибка ИБ)
                    if (newCode !== 'AERO_99') {
                        showError('⚠️ Security protocol failed. Invalid credentials provided.');
                        return;
                    }

                    // 4. Проверка шифра восстановления (единая ошибка ИБ)
                    // (Мы уже знаем, что callsign === 'KNOPA', поэтому MOCK_USERS[callsign] безопасен)
                    if (cipher !== MOCK_USERS[callsign].recoveryCipher) {
                        showError('⚠️ Security protocol failed. Invalid credentials provided.');
                        return;
                    }

                    // 5. Проверка: пользователь уже восстановлен? (явная ошибка)
                    const existingRestoredStr = localStorage.getItem('restoredUsers');
                    if (existingRestoredStr) {
                        try {
                            const existingRestored = JSON.parse(existingRestoredStr);
                            if (existingRestored[callsign]) {
                                showError(
                                    "⚠️ Operator 'KNOPA' has already been restored. Please use your new credentials to log in.",
                                    '> SECURITY PROTOCOL FAILED. OPERATOR ALREADY RESTORED.'
                                );
                                return;
                            }
                        } catch (e) { }
                    }

                    // === УСПЕХ ===
                    // 6. Сохраняем данные в localStorage
                    let restoredUsers = {};
                    const restoredUsersStr = localStorage.getItem('restoredUsers');
                    if (restoredUsersStr) {
                        try { restoredUsers = JSON.parse(restoredUsersStr); } catch (e) { }
                    }

                    restoredUsers[callsign] = {
                        ...MOCK_USERS[callsign],
                        accessCode: newCode // Перезаписываем только новый пароль
                    };
                    localStorage.setItem('restoredUsers', JSON.stringify(restoredUsers));


                    // 7. Заполняем данные на втором экране
                    const userData = MOCK_USERS[callsign]; // Для удобства
                    document.getElementById('sum-callsign').textContent = userData.callsign;
                    document.getElementById('sum-role').textContent = userData.roleIcon + ' ' + userData.role.charAt(0).toUpperCase() + userData.role.slice(1).toLowerCase();
                    document.getElementById('sum-function').textContent = userData.function;
                    document.getElementById('sum-id').textContent = userData.id;
                    document.getElementById('sum-new-code').textContent = newCode;

                    // 8. Переключаем экраны
                    restorationForm.classList.add('hidden');
                    successScreen.classList.remove('hidden');
                    document.body.classList.add('signal-restored');

                    // Скрываем логотип и подзаголовок
                    const mainLogo = document.querySelector('.login-card > .login-logo');
                    if (mainLogo) mainLogo.classList.add('hidden');

                    const subtitle = document.getElementById('page-subtitle');
                    if (subtitle) {
                        subtitle.style.display = 'none';
                    }
                    telemetryText.style.color = '#2ecc71';
                    telemetryText.innerHTML = '> RESTORATION COMPLETE. NEW CREDENTIALS ISSUED.';

                    // 🔄 ДОБАВЛЕНО: Сброс состояния кнопки для чистоты кода
                    restoreBtn.classList.remove('processing');
                    restoreBtn.textContent = 'RESTORE ACCESS';
                    isProcessing = false;

                }, 2000); // ⏱️ ИЗМЕНЕНО: закрывающий таймер тоже на 2000 мс
            }

            function showError(message, telemetryMessage = '> SECURITY PROTOCOL FAILED. RESTORATION ABORTED') {
                errorBlock.textContent = message;
                errorBlock.classList.add('visible');
                telemetryText.style.color = '#e74c3c';
                telemetryText.innerHTML = telemetryMessage;

                // 🔄 ДОБАВЛЕНО: Сброс состояния кнопки при ошибке
                restoreBtn.classList.remove('processing');
                restoreBtn.disabled = false;
                restoreBtn.textContent = 'RESTORE ACCESS';
                isProcessing = false;
            }

            // === 8. ПРОВЕРКА СОСТОЯНИЯ ПРИ ЗАГРУЗКЕ (F5 защита) ===
            if (sessionStorage.getItem('restorationSuccess') === 'true') {
                try {
                    const restoredUsersStr = localStorage.getItem('restoredUsers');
                    const restoredCallsign = sessionStorage.getItem('restoredCallsign'); // ✅ Читаем сохраненный позывной

                    if (restoredUsersStr && restoredCallsign) {
                        const restoredCheck = JSON.parse(restoredUsersStr);

                        // ✅ Ищем пользователя по сохраненному позывному, а не по пустому полю ввода
                        const user = restoredCheck[restoredCallsign] || MOCK_USERS[restoredCallsign];

                        if (user) {
                            document.getElementById('sum-callsign').textContent = user.callsign;
                            document.getElementById('sum-role').textContent = user.roleIcon + ' ' + user.role.charAt(0).toUpperCase() + user.role.slice(1).toLowerCase();
                            document.getElementById('sum-function').textContent = user.function;
                            document.getElementById('sum-id').textContent = user.id;
                            document.getElementById('sum-new-code').textContent = user.accessCode;

                            // Переключаем экраны ТОЛЬКО если пользователь найден
                            restorationForm.classList.add('hidden');
                            successScreen.classList.remove('hidden');
                            document.body.classList.add('signal-restored');

                            const mainLogo = document.querySelector('.login-card > .login-logo');
                            if (mainLogo) mainLogo.classList.add('hidden');

                            const subtitle = document.getElementById('page-subtitle');
                            if (subtitle) subtitle.classList.add('hidden');

                            telemetryText.style.color = '#2ecc71';
                            telemetryText.innerHTML = '> RESTORATION COMPLETE. NEW CREDENTIALS ISSUED.';
                        }
                    }
                } catch (e) {
                    console.error("F5 restore error:", e);
                }
            }

            // === 9. EVENT BINDINGS ===
            restorationForm.addEventListener('submit', handleRestoration);
        });

        // 🧹 ОЧИСТКА СЕССИИ ПРИ УХОДЕ СО СТРАНИЦЫ ИЛИ ОБНОВЛЕНИИ
        window.addEventListener('beforeunload', () => {
            sessionStorage.removeItem('restorationSuccess');
            sessionStorage.removeItem('restoredCallsign');
        });
    </script>

</body>

</html>
