<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="public, max-age=86400">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cassandra — Star System</title>
    <style>
        :root {
            --corner-btn-size: 10vmin;
            --corner-btn-border: 0.2vmin;
            --corner-btn-gap: 0.35vmin;
            --corner-icon-size: 3vmin;
            --corner-label-size: 1.1vmin;
            --corner-btn-offset-v: 4vh;
            --corner-btn-offset-h: 2vw;

            --planet-size: 10vmin;
            --planet-border: 0.2vmin;
            --planet-gap: 0.35vmin;
            --planet-icon-size: 3vmin;
            --planet-label-size: 0.9vmin;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', sans-serif;
        }

        body {
            color: #e8ecff;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            background-color: #050816;
        }

        .stars {
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(1px 1px at 10% 10%, rgba(255, 255, 255, .9), transparent 50%),
                radial-gradient(1.5px 1.5px at 20% 30%, rgba(255, 255, 255, .7), transparent 50%),
                radial-gradient(1px 1px at 30% 70%, rgba(255, 255, 255, .8), transparent 50%),
                radial-gradient(2px 2px at 40% 20%, rgba(255, 255, 255, .6), transparent 50%),
                radial-gradient(1px 1px at 50% 50%, rgba(255, 255, 255, .9), transparent 50%),
                radial-gradient(1.5px 1.5px at 60% 80%, rgba(255, 255, 255, .7), transparent 50%),
                radial-gradient(1px 1px at 70% 40%, rgba(255, 255, 255, .8), transparent 50%),
                radial-gradient(2px 2px at 80% 90%, rgba(255, 255, 255, .5), transparent 50%),
                radial-gradient(1px 1px at 90% 15%, rgba(255, 255, 255, .9), transparent 50%),
                linear-gradient(180deg, #050816 0%, #0a0e27 50%, #131b3a 100%);
            background-size: 15vmin 15vmin, 20vmin 20vmin, 18vmin 18vmin, 25vmin 25vmin,
                16vmin 16vmin, 22vmin 22vmin, 19vmin 19vmin, 28vmin 28vmin,
                17vmin 17vmin, 100% 100%;
        }

        .milkyway {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .milkyway .band {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 280vmax;
            height: 25vmin;
            transform: translate(-50%, -50%) rotate(-28deg);
            background: linear-gradient(180deg,
                    transparent,
                    rgba(120, 160, 255, .08) 15%,
                    rgba(190, 215, 255, .18) 35%,
                    rgba(255, 255, 255, .25) 50%,
                    rgba(190, 215, 255, .18) 65%,
                    rgba(120, 160, 255, .08) 85%,
                    transparent);
            filter: blur(1.5vmin);
        }

        .star-system-title {
            position: fixed;
            top: 8vmin;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 100;
            font-size: 3vmin;
            font-weight: 700;
            letter-spacing: 0.4vmin;
            text-transform: uppercase;
            opacity: 0.9;
            pointer-events: none;
        }

        .star-system-title .white-part {
            color: #ffffff;
            text-shadow: 0 0 1vmin rgba(255, 255, 255, 0.5);
        }

        .star-system-title .blue-part {
            color: #4da6ff;
            text-shadow: 0 0 2vmin rgba(77, 166, 255, 0.8);
        }

        .login-footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: center;
            color: #4a5480;
            font-size: 1.2vmin;
            letter-spacing: 0.1vmin;
            padding-bottom: 2vmin;
        }

        .copyright {
            margin-top: 4vmin;
            font-size: 1.4vmin;
            letter-spacing: 0.15vmin;
            color: #5a6488;
        }

        .telemetry {
            color: #4da6ff;
            font-family: 'Courier New', monospace;
            margin-bottom: 0.8vmin;
            font-size: 1.3vmin;
            text-transform: uppercase;
            letter-spacing: 0.1vmin;
            text-shadow: 0 0 0.8vmin rgba(77, 166, 255, 0.4);
            min-height: 2vmin;
        }

        .telemetry-cassan {
            color: #ffffff !important;
        }

        .telemetry-dra {
            color: #4da6ff !important;
            text-shadow: 0 0 0.6vmin rgba(77, 166, 255, 0.6) !important;
        }

        .telemetry::after {
            content: "█";
            animation: blink 1s step-end infinite;
            margin-left: 0.4vmin;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .dashboard-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            box-sizing: border-box;
            gap: 5vh;
        }

        .corner-circle-btn {
            position: fixed;
            width: var(--corner-btn-size);
            height: var(--corner-btn-size);
            border-radius: 50%;
            border: var(--corner-btn-border) solid rgba(77, 166, 255, 0.6);
            background: rgba(10, 15, 40, 0.7);
            backdrop-filter: blur(1vmin);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--corner-btn-gap);
            z-index: 10;
            box-shadow:
                0 0 0.5vmin rgba(77, 166, 255, 0.3),
                inset 0 0 0.5vmin rgba(77, 166, 255, 0.2),
                0 0 1.5vmin rgba(77, 166, 255, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
            padding: 0;
            text-align: center;
        }

        .corner-circle-btn:hover {
            border-color: rgba(77, 166, 255, 1);
            box-shadow:
                0 0 1vmin rgba(77, 166, 255, 0.6),
                inset 0 0 1vmin rgba(77, 166, 255, 0.4),
                0 0 3vmin rgba(77, 166, 255, 0.8);
        }

        .corner-circle-btn.bottom-left {
            bottom: var(--corner-btn-offset-v);
            left: var(--corner-btn-offset-h);
            transform: translate(0, 0);
        }

        .corner-circle-btn.bottom-right {
            bottom: var(--corner-btn-offset-v);
            right: var(--corner-btn-offset-h);
            transform: translate(0, 0);
        }

        .corner-circle-btn.top-left {
            top: var(--corner-btn-offset-v);
            left: var(--corner-btn-offset-h);
            transform: translate(0, 0);
        }

        .corner-circle-btn.top-right {
            top: var(--corner-btn-offset-v);
            right: var(--corner-btn-offset-h);
            transform: translate(0, 0);
        }

        .corner-icon {
            font-size: var(--corner-icon-size);
            line-height: 1;
            filter: drop-shadow(0 0 0.8vmin rgba(77, 166, 255, 0.5));
        }

        .corner-label {
            font-size: var(--corner-label-size);
            font-weight: 600;
            text-align: center;
            line-height: 1.2;
            color: #e8ecff;
            text-transform: uppercase;
            letter-spacing: 0.05vmin;
        }

        .bottom-left:hover,
        .bottom-right:hover {
            transform: scale(1.15);
            border-color: rgba(77, 166, 255, 1);
            box-shadow:
                0 0 1vmin rgba(77, 166, 255, 0.6),
                inset 0 0 1vmin rgba(77, 166, 255, 0.4),
                0 0 3vmin rgba(77, 166, 255, 0.8);
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .bottom-left:active,
        .bottom-right:active {
            transform: scale(1.1);
        }

        .planet-bar {
            position: fixed;
            bottom: 16vh;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 3vmin;
            z-index: 10;
        }

        .planet-btn {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            outline: none;
            width: var(--planet-size);
            height: var(--planet-size);
            border-radius: 50%;
            border: var(--planet-border) solid rgba(77, 166, 255, 0.6);
            background: rgba(10, 15, 40, 0.7);
            backdrop-filter: blur(1vmin);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--planet-gap);
            position: relative;
            transition: all 0.3s ease;
            box-shadow:
                0 0 0.5vmin rgba(77, 166, 255, 0.3),
                inset 0 0 0.5vmin rgba(77, 166, 255, 0.2),
                0 0 1.5vmin rgba(77, 166, 255, 0.4);
        }

        .planet-btn:hover {
            transform: scale(1.15);
            border-color: rgba(77, 166, 255, 1);
            box-shadow:
                0 0 1vmin rgba(77, 166, 255, 0.6),
                inset 0 0 1vmin rgba(77, 166, 255, 0.4),
                0 0 3vmin rgba(77, 166, 255, 0.8);
        }

        .planet-btn:active {
            transform: scale(1.1);
        }

        .planet-icon {
            width: 3.5vmin;
            height: 3.5vmin;
            border-radius: 50%;
            margin-bottom: 0.2vmin;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 30% 30%, #ffffff, var(--p-color, #888), #000000);
            box-shadow: 0 0 1.5vmin color-mix(in srgb, var(--p-color, #888) 50%, transparent),
                0 0 3vmin color-mix(in srgb, var(--p-color, #888) 25%, transparent);
        }

        .planet-label {
            font-size: var(--planet-label-size);
            font-weight: 600;
            color: #e8ecff;
            text-transform: uppercase;
            letter-spacing: 0.08vmin;
            text-align: center;
            line-height: 1.1;
            text-shadow: 0 0 1vmin rgba(0, 0, 0, 0.8);
            padding: 0 0.8vmin;
            margin-top: 0;
            min-height: 2.2vmin;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .top-right .corner-icon {
            margin-top: -1.3vmin;
            margin-bottom: 0.4vmin;
        }

        .top-right .corner-label {
            color: #2ecc71 !important;
            text-shadow: 0 0 0.8vmin rgba(46, 204, 113, 0.5) !important;
        }

        .top-left .corner-label,
        .bottom-left .corner-label,
        .bottom-right .corner-label,
        .planet-btn .planet-label {
            color: #ffffff !important;
            text-shadow: none !important;
        }

        .top-left .corner-icon {
            margin-top: -1.3vmin;
            margin-bottom: 0.4vmin;
        }

        .top-left .corner-label {
            margin-top: 0.4vmin;
        }

        .bottom-right .corner-icon {
            margin-top: -1.3vmin;
            margin-bottom: 0.4vmin;
        }

        .bottom-right .corner-label {
            margin-top: 0.4vmin;
        }

        .bottom-left .corner-icon {
            margin-top: -1.3vmin;
            margin-bottom: 0.4vmin;
        }

        .bottom-left .corner-label {
            margin-top: 0.4vmin;
        }

        .top-left,
        .top-right {
            cursor: default;
            border: var(--corner-btn-border) solid rgba(77, 166, 255, 0.6);
            box-shadow:
                0 0 0.5vmin rgba(77, 166, 255, 0.3),
                inset 0 0 0.5vmin rgba(77, 166, 255, 0.2),
                0 0 1.5vmin rgba(77, 166, 255, 0.4);
            transition: all 0.3s ease;
        }

        .top-left:hover,
        .top-right:hover {
            border-color: rgba(77, 166, 255, 0.8);
            box-shadow: 0 0 1.5vmin rgba(77, 166, 255, 0.4), inset 0 0 1.5vmin rgba(77, 166, 255, 0.2);
            transform: none !important;
        }

        .info-tooltip {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(10, 15, 30, 0.95);
            border: 0.1vmin solid #4da6ff;
            border-radius: 0.5vmin;
            padding: 1.2vmin 1.8vmin;
            font-size: 1.2vmin;
            color: #e8ecff;
            min-width: 14vw;
            max-width: 18vw;
            white-space: normal;
            word-wrap: break-word;
            overflow-wrap: break-word;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 0 1.5vmin rgba(77, 166, 255, 0.5);
            text-align: left;
            line-height: 1.6;
        }

        .top-left .info-tooltip {
            left: 115%;
            transform: translateY(-50%);
        }

        .top-right .info-tooltip {
            right: 115%;
            left: auto;
            transform: translateY(-50%);
        }

        .top-left:hover .info-tooltip,
        .top-right:hover .info-tooltip {
            opacity: 1;
            visibility: visible;
        }

        .top-left:hover .info-tooltip {
            transform: translateY(-50%) translateX(0.5vmin);
        }

        .top-right:hover .info-tooltip {
            transform: translateY(-50%) translateX(-0.5vmin);
        }

        .info-tooltip .tooltip-title {
            color: #4da6ff;
            font-weight: bold;
            margin-bottom: 0.5vmin;
            border-bottom: 0.1vmin solid rgba(77, 166, 255, 0.3);
            padding-bottom: 0.3vmin;
            letter-spacing: 0.1vmin;
        }

        .top-right .info-tooltip,
        .top-left .info-tooltip {
            width: 8vw;
            min-width: 6vw;
            max-width: 10vw;
        }

        .top-right .info-tooltip {
            text-align: right;
        }

        .panel-online {
            border-color: rgba(77, 166, 255, 0.8) !important;
            box-shadow:
                0 0 1.5vmin rgba(77, 166, 255, 0.5),
                inset 0 0 1vmin rgba(77, 166, 255, 0.3) !important;
            background: rgba(10, 15, 40, 0.7) !important;
            pointer-events: auto !important;
            cursor: pointer !important;
            filter: none !important;
            opacity: 1 !important;
            transition: all 0.8s ease-in-out;
        }

        .panel-online .corner-icon,
        .panel-online .corner-label,
        .panel-online .status-dot {
            filter: none !important;
        }

        .planet-icon.sun {
            background: radial-gradient(circle at 30% 30%, #fff5b0, #ffcc00, #ff8800);
            box-shadow: 0 0 2vmin rgba(255, 200, 0, 0.8), 0 0 4vmin rgba(255, 150, 0, 0.4);
        }

        .planet-icon.alpha {
            background: radial-gradient(circle at 30% 30%, #ffffff, #ffe066, #ffaa00);
            box-shadow: 0 0 2vmin rgba(255, 255, 220, 0.9), 0 0 3vmin rgba(255, 200, 100, 0.5);
        }

        .planet-icon.epsilon {
            background: radial-gradient(circle at 30% 30%, #ffcc66, #ff8800, #cc5500);
            box-shadow: 0 0 1.5vmin rgba(255, 136, 0, 0.7);
        }

        .planet-icon.epsilon::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-20deg);
            width: 140%;
            height: 30%;
            border: 0.2vmin solid rgba(255, 220, 150, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 0.5vmin rgba(255, 220, 150, 0.4);
        }

        .planet-icon.tau {
            background: radial-gradient(circle at 30% 30%, #fff0b3, #ffdb4d, #e6b800);
            box-shadow: 0 0 1.5vmin rgba(255, 219, 77, 0.7);
        }

        .planet-icon.teegarden {
            background: radial-gradient(circle at 30% 30%, #ff6666, #cc0000, #660000);
            box-shadow: 0 0 1.5vmin rgba(204, 0, 0, 0.8), 0 0 3vmin rgba(150, 0, 0, 0.4);
        }

        .planet-icon.trappist {
            background: radial-gradient(circle at 30% 30%, #99e6ff, #0088ff, #0044aa);
            box-shadow: 0 0 2vmin rgba(0, 136, 255, 0.8), 0 0 4vmin rgba(0, 80, 200, 0.5);
        }

        .star-container {
            position: fixed;
            top: 47%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 0;
            height: 0;
            z-index: 25;
            perspective: 100vmin;
            cursor: pointer;
        }

        .star-sphere {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30vmin;
            height: 30vmin;
            border-radius: 50%;
            z-index: 10;
            cursor: pointer;
        }

        .star-glow-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30vmin;
            height: 30vmin;
            border-radius: 50%;
            border: 0.2vmin solid rgba(77, 166, 255, 0.6);
            box-shadow:
                0 0 0.5vmin rgba(77, 166, 255, 0.3),
                inset 0 0 0.5vmin rgba(77, 166, 255, 0.2),
                0 0 1.5vmin rgba(77, 166, 255, 0.4);
            pointer-events: none;
            z-index: 1;
        }

        .star-sphere.sun {
            background-color: transparent;
            background-image: url('assets/stars/g-dwarf-max.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(1);

                0 0 8vmin rgba(255, 150, 0, 0.4);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
        }

        .star-sphere.sun::before {

        .planet-icon.planet-trappist-1h::before {
            content: none !important;
        }

        .planet-icon.planet-trappist-1h::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background: radial-gradient(circle at 30% 30%, rgba(210, 230, 250, 0.5) 0%, transparent 45%);
            border-radius: 50%;
            pointer-events: none;
        }

        .cassandra-logo {
            cursor: default !important;
            pointer-events: none !important;
            transform: none !important;
            opacity: 0.55 !important;
            filter: brightness(0.7) !important;
        }

        .cassandra-logo:hover,
        .cassandra-logo:active {
            transform: none !important;
            opacity: 0.7 !important;
            filter: brightness(0.7) !important;
            border-color: rgba(77, 166, 255, 0.3) !important;
            box-shadow:
                0 0 0.3vmin rgba(77, 166, 255, 0.15),
                inset 0 0 0.3vmin rgba(77, 166, 255, 0.1) !important;
        }

        .cassandra-label {
            font-size: 1.3vmin !important;
            letter-spacing: 0.05vmin;
            display: flex;
            gap: 0.1vmin;
        }

        .cassandra-label .cassan {
            color: #ffffff !important;
            text-shadow: 0 0 0.5vmin rgba(255, 255, 255, 0.5);
        }

        .cassandra-label .dra {
            color: #4da6ff !important;
            text-shadow: 0 0 0.8vmin rgba(77, 166, 255, 0.8);
        }
    </style>
</head>

<body>

    <div class="stars"></div>
    <div class="milkyway">
        <div class="band"></div>
    </div>

    <div class="star-system-title" data-wm-id="star-system-title">
        <span class="white-part">STAR SYSTEM</span> <span class="blue-part">...</span>
    </div>

    <div class="star-container"
        onclick="window.location.href='star-info.html?star=' + new URLSearchParams(window.location.search).get('star')">
        <div class="star-glow-ring"></div>
        <div class="star-sphere" id="main-star"></div>
        <div class="star-label" id="star-name-label">SOL</div>
    </div>

    <div class="corner-circle-btn top-left panel-offline" data-wm-id="info-panel-role">
        <span class="corner-icon" data-wm-id="role-icon">🛰️</span>
        <span class="corner-label" data-wm-id="role-label">STANDBY</span>
        <div class="info-tooltip">
            <div class="tooltip-title">SYSTEM ROLE</div>
            <div>Function: Comms & Diagnostics</div>
            <div>Access: Level 2</div>
            <div>Status: Active</div>
        </div>
    </div>

    <div class="corner-circle-btn top-right panel-offline" data-wm-id="info-panel-user">
        <span class="corner-icon" data-wm-id="user-icon">👨‍🚀</span>
        <span class="corner-label" data-wm-id="user-label">UNKNOWN</span>
        <div class="info-tooltip">
            <div class="tooltip-title">CREW MEMBER</div>
            <div>Registered Callsign: AURORA</div>
            <div>ID: 884-2A</div>
            <div>Status: Online</div>
        </div>
    </div>

    <button class="corner-circle-btn bottom-left" data-wm-id="nav-galaxy-map-btn"
        onclick="window.location.href='galaxy-map.html'">
        <span class="corner-icon">🌌</span>
        <span class="corner-label">Galaxy<br>Map</span>
    </button>

    <div class="corner-circle-btn bottom-right cassandra-logo">
        <span class="corner-label cassandra-label">
            <span class="cassan">CASSAN</span><span class="dra">DRA</span>
        </span>
    </div>

    <div class="planet-bar" data-wm-id="planet-bar"></div>

    <footer class="login-footer">
        <div class="telemetry" id="dashboard-telemetry" data-wm-id="system-telemetry"></div>
        <div class="copyright">Evknopia © 2026</div>
    </footer>

    <script src="data.js"></script>
    <script>
        function getStarFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const starKey = urlParams.get('star');

            if (!starKey || starKey.trim() === '') {
                console.warn('⚠️ Параметр star пуст или отсутствует');
                window.location.href = 'galaxy-map.html';
                return null;
            }

            console.log('🌟 Загружена звезда:', starKey);
            return starKey;
        }

        function preloadPlanetsForStar(starKey) {
            const planetAssets = {
                'sun': [
                    'assets/sun/mercury_icon.jpg', 'assets/sun/venus_icon.jpg',
                    'assets/sun/earth_icon.jpg', 'assets/sun/mars_icon.jpg',
                    'assets/sun/uranus_icon.jpg', 'assets/sun/neptune_icon.jpg'
                ],
                'alpha-centauri': [
                    'assets/alpha_centauri_a/proxima_b.jpg',
                    'assets/alpha_centauri_a/proxima_c.jpg',
                    'assets/alpha_centauri_a/proxima_d.jpg'
                ],
                'tau-ceti': [
                    'assets/tau_ceti/tau_ceti_e.jpg', 'assets/tau_ceti/tau_ceti_f.jpg',
                    'assets/tau_ceti/tau_ceti_g.jpg', 'assets/tau_ceti/tau_ceti_h.jpg'
                ],
                'epsilon-eridani': [
                    'assets/epsilon_eridani/epsilon_eridani_c.jpg'
                ],
                'teegarden': [
                    'assets/teegarden/teegarden_b.jpg', 'assets/teegarden/teegarden_c.jpg'
                ],
                'trappist-1': [
                    'assets/trappist_1/trappist_1_b.jpg', 'assets/trappist_1/trappist_1_c.jpg',
                    'assets/trappist_1/trappist_1_d.jpg', 'assets/trappist_1/trappist_1_e.jpg',
                    'assets/trappist_1/trappist_1_f.jpg', 'assets/trappist_1/trappist_1_g.jpg',
                    'assets/trappist_1/trappist-1h.jpg'
                ]
            };

            const imagesToLoad = planetAssets[starKey] || [];
            imagesToLoad.forEach(url => {
                const link = document.createElement('link');
                link.rel = 'preload';
                link.as = 'image';
                link.href = url;
                document.head.appendChild(link);
            });
            console.log(`🚀 Preload initiated for ${imagesToLoad.length} planet assets.`);
        }

        function initDashboard() {
            const userDataStr = sessionStorage.getItem('currentUser');

            if (!userDataStr) {
                const telemetry = document.getElementById('dashboard-telemetry');
                if (telemetry) {
                    telemetry.innerHTML = `> <span class="telemetry-cassan">CASSAN</span><span class="telemetry-dra">DRA</span>: <span data-wm-id="telemetry-message" style="color: #e74c3c;">ACCESS DENIED. REDIRECTING...</span>`;
                }
                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                return;
            }

            const starKey = getStarFromURL();
            if (!starKey) return;

            preloadPlanetsForStar(starKey);

            const starData = window.starDatabase[starKey];
            if (!starData) {
                console.error(`❌ Звезда "${starKey}" не найдена в базе данных`);
                return;
            }

            console.log('✅ Данные звезды загружены:', starData);

            let user = {};
            try {
                user = JSON.parse(userDataStr);
            } catch (e) {
                sessionStorage.removeItem('currentUser');
                window.location.href = 'login.html';
                return;
            }

            const callsign = user.callsign ? user.callsign.toUpperCase() : 'UNKNOWN';
            const fullName = user.fullName || 'Unknown Operator';
            const role = user.role || 'OPERATOR';
            const roleIcon = user.roleIcon || '🛰️';
            const accessLevel = user.accessLevel || '?';
            const func = user.function || 'General Duties';
            const userId = user.id || 'UNKNOWN';

            const roleIconEl = document.querySelector('.top-left .corner-icon');
            const roleLabelEl = document.querySelector('.top-left .corner-label');
            const roleTooltipEl = document.querySelector('.top-left .info-tooltip');

            if (roleIconEl) roleIconEl.textContent = roleIcon;
            if (roleLabelEl) roleLabelEl.textContent = role;
            if (roleTooltipEl) {
                roleTooltipEl.innerHTML = `
                    <div class="tooltip-title">SYSTEM ROLE</div>
                    <div>Function: ${func}</div>
                    <div>Access: Level ${accessLevel}</div>
                    <div>Status: Active</div>
                `;
            }

            const userLabelEl = document.querySelector('.top-right .corner-label');
            const userTooltipEl = document.querySelector('.top-right .info-tooltip');

            if (userLabelEl) userLabelEl.textContent = fullName.toUpperCase();
            if (userTooltipEl) {
                userTooltipEl.innerHTML = `
                    <div class="tooltip-title">CREW MEMBER</div>
                    <div>Registered Callsign: ${callsign}</div>
                    <div>ID: ${userId}</div>
                    <div>Status: Online</div>
                `;
            }

            const telemetry = document.getElementById('dashboard-telemetry');
            if (telemetry) {
                const candidates = starData.planetData.filter(p => p.type !== 'Gas Giant').length;
                telemetry.innerHTML = `> <span class="telemetry-cassan">CASSAN</span><span class="telemetry-dra">DRA</span>: <span data-wm-id="telemetry-message" style="color: #2ecc71;">${callsign}, SCANNING ${starData.name.toUpperCase()} SYSTEM... ${candidates} PLANETS DETECTED. AWAITING SELECTION.</span>`;
            }

            const titleWhitePart = document.querySelector('.star-system-title .white-part');
            const titleBluePart = document.querySelector('.star-system-title .blue-part');

            if (titleWhitePart) titleWhitePart.textContent = 'STAR SYSTEM';
            if (titleBluePart) titleBluePart.textContent = starData.designation || starData.name;

            const starSphere = document.getElementById('main-star');
            const starLabel = document.getElementById('star-name-label');

            if (starSphere) {
                starSphere.className = 'star-sphere'; // Сброс классов перед добавлением новых
                const starColorClass = starData.sphereClass.replace('sphere-', '');
                starSphere.classList.add(starColorClass);
            }

            if (starLabel) {
                starLabel.textContent = starData.name.toUpperCase();
            }

            const planetBar = document.querySelector('.planet-bar');
            if (planetBar && starData.planetData) {
                planetBar.innerHTML = '';

                starData.planetData.forEach(planet => {
                    if (planet.type === 'Gas Giant') return;

                    const btn = document.createElement('button');
                    btn.className = 'planet-btn';
                    btn.setAttribute('data-wm-id', `planet-${planet.id}-btn`);
                    btn.onclick = () => window.location.href = `planet.html?star=${starKey}&planet=${planet.id}`;

                    const icon = document.createElement('div');
                    icon.className = `planet-icon planet-${planet.id}`;

                    const label = document.createElement('span');
                    label.className = 'planet-label';
                    label.textContent = planet.name;

                    btn.appendChild(icon);
                    btn.appendChild(label);
                    planetBar.appendChild(btn);
                });
            }
        }

        function handleLogout() {
            sessionStorage.removeItem('currentUser');
            sessionStorage.removeItem('uplinkCompleted');
            sessionStorage.removeItem('freshLogin');
            window.location.href = 'login.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            initDashboard();
        });

        window.addEventListener('pageshow', function (event) {
            if (event.persisted) {
                console.warn('⚠️ Страница восстановлена из bfcache — принудительная проверка');
                initDashboard();
            }
        });
    </script>

</body>

</html>
